<html lang="en">
<head>

<title>Production Planning – Day-wise | AMTC Foundry</title>
<!-- Prepared by Ajay Kumar, NPD Coordinator. Single-file app: vanilla JS, SheetJS (Excel import), Chart.js, optional Firebase Firestore. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#E8ECF0; --panel:#FFFFFF; --ink:#16212C; --muted:#5A6977; --line:#CBD3DB; --soft:#F3F5F7;
  --steel:#2C4760; --steel-2:#3E6283; --heat:#D9730D; --heat-soft:#FCEBD7;
  --ok:#2D7A4C; --ok-soft:#DDF1E4; --warn:#B07A00; --warn-soft:#FBF0CF; --bad:#B8322A; --bad-soft:#F8DEDB;
  --r-s:4px; --r-m:8px;
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:14px; color:var(--ink); background:var(--bg);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;line-height:1.45}
.num,.cond{font-family:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--heat);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
a{color:var(--steel-2)}

/* shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{background:var(--steel);color:#DCE6EF;padding:18px 0;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 18px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
.brand b{display:block;font-size:17px;color:#fff;letter-spacing:.2px}
.brand span{font-size:12px;opacity:.75}
.nav button{all:unset;display:flex;align-items:center;gap:10px;width:100%;padding:9px 18px;cursor:pointer;font-size:14px;box-sizing:border-box}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current=page]{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 var(--heat)}
.nav .sep{height:1px;background:rgba(255,255,255,.12);margin:8px 18px}
.rail .who{margin-top:auto;padding:14px 18px;font-size:12px;border-top:1px solid rgba(255,255,255,.12)}
.rail .who b{display:block;color:#fff;font-size:14px}
.rail .who button{margin-top:8px;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:var(--r-s);padding:4px 10px;cursor:pointer}
main{padding:22px 28px 60px;min-width:0}
.topline{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:24px;font-weight:600;margin:0;letter-spacing:-.2px}
h2{font-size:17px;font-weight:600;margin:26px 0 10px}
h3{font-size:14px;font-weight:600;margin:0 0 8px}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.banner{border-radius:var(--r-m);padding:10px 14px;margin:0 0 14px;font-size:13px;border:1px solid}
.banner.info{background:#E4EDF5;border-color:#B9CCDD}
.banner.warn{background:var(--warn-soft);border-color:#E5CF8C}
.banner.bad{background:var(--bad-soft);border-color:#E7B3AD}

/* controls */
.btn{border:1px solid var(--steel);background:var(--steel);color:#fff;border-radius:var(--r-s);padding:7px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--steel-2)}
.btn.ghost{background:#fff;color:var(--steel)}
.btn.heat{background:var(--heat);border-color:var(--heat)}
.btn.danger{background:#fff;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.field input,.field select{min-width:130px}
input,select,textarea{border:1px solid var(--line);border-radius:var(--r-s);padding:6px 8px;background:#fff}
input[type=number]{width:90px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--steel);color:#fff}

/* panels & tables */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.kpi{background:#fff;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-m)}
.kpi .v{font-size:24px;font-weight:600;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.bad .v{color:var(--bad)} .kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-m);background:#fff;max-height:620px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:#EEF1F4;text-align:left;font-weight:600;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
td{padding:6px 9px;border-bottom:1px solid #E6EAEE;vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr:hover{background:#F7F9FB}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.chip.Delayed,.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:#EDC1BC}
.chip.Due,.chip.warn{background:var(--warn-soft);color:#7A5600;border-color:#EBD596}
.chip.On,.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:#BFE1CB}
.chip.LT,.chip.mute{background:#EEF1F4;color:var(--muted);border-color:#D9DFE5}
.chip.heat{background:var(--heat-soft);color:#8A4500;border-color:#F2CFA6}
.chip.blue{background:#E2ECF5;color:var(--steel);border-color:#C4D5E5}
.muted{color:var(--muted)}
.small{font-size:12px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--heat);font-weight:600}

/* route strip: the casting route as a sequence */
.route{display:flex;gap:0;overflow-x:auto;padding-bottom:4px}
.stage{flex:1 0 130px;position:relative;background:#fff;border:1px solid var(--line);border-left:0;padding:10px 12px 10px 18px;cursor:pointer;min-width:130px}
.stage:first-child{border-left:1px solid var(--line);border-radius:var(--r-m) 0 0 var(--r-m);padding-left:12px}
.stage:last-child{border-radius:0 var(--r-m) var(--r-m) 0}
.stage::after{content:"";position:absolute;right:-9px;top:50%;width:16px;height:16px;background:inherit;border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg);z-index:2}
.stage:last-child::after{display:none}
.stage .code{font-size:11px;color:var(--muted)}
.stage .nm{font-weight:600;font-size:13px;line-height:1.2;min-height:32px}
.stage .ad{font-size:22px;font-weight:600;margin-top:4px}
.stage .meta{font-size:11px;color:var(--muted)}
.stage.sel{background:#EAF1F7}
.stage.ht .nm{color:#8A4500}
.bar{height:6px;background:#E6EAEE;border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--steel-2)}

/* gantt */
.gantt{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r-m);overflow-x:auto}
.gantt svg{display:block}
.gantt text{font-family:"IBM Plex Sans Condensed","Arial Narrow",sans-serif}

/* forecast mini bars */
.fc{display:flex;gap:3px;align-items:flex-end;height:46px}
.fc div{width:22px;background:var(--steel-2);border-radius:2px 2px 0 0;position:relative}
.fc div.part{background:#9DB4C9}
.fc div span{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}

/* login */
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#2C4760 0%,#1B2D3E 100%)}
.login form{background:#fff;border-radius:10px;padding:28px 30px;width:340px;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:20px}
.login .glow{height:4px;border-radius:2px;background:linear-gradient(90deg,#B84A00,#F2A33A,#FFE0A3);margin:-4px 0 6px}

/* modal */
dialog{border:0;border-radius:10px;padding:0;max-width:min(960px,96vw);width:100%;box-shadow:0 20px 60px rgba(10,20,30,.35)}
dialog::backdrop{background:rgba(16,28,40,.45)}
.dlg-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dlg-b{padding:16px 18px;max-height:70vh;overflow:auto}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r-m);font-size:13px;z-index:50;max-width:420px}
.toast.bad{background:var(--bad)}
.chart-box{position:relative;height:260px}
.invalid{border-color:var(--bad)!important;background:var(--bad-soft)!important}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:8px}
  .brand,.rail .who{display:none}
  .nav{display:flex;flex-wrap:wrap}
  .nav button{width:auto;padding:8px 12px}
  .nav .sep{display:none}
  main{padding:14px}
  .g2{grid-template-columns:1fr}
}

td.wrap{white-space:normal;min-width:180px;max-width:280px}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px}
.day{flex:0 0 auto;min-width:104px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:#fff;border:1px solid var(--line);border-radius:var(--r-m);padding:7px 9px;cursor:pointer;text-align:left}
.day:hover{border-color:var(--steel-2)}
.day .wd{font-size:11px;color:var(--muted)}
.day .dt{font-weight:600;font-size:14px}
.day .chip{font-size:11px;padding:0 7px}
.day.today{border-top:3px solid var(--heat)}
.day.sel{border-color:var(--steel);box-shadow:inset 0 0 0 1px var(--steel);background:#EAF1F7}
.dtiles{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.dtile{display:flex;flex-direction:column;gap:2px;min-width:112px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--soft)}
.dtile b{font-size:15px}
.dtile.lock{background:#EEF1F4;opacity:.8}

<body>
<div id="root"></div>
<script>
/* ===================== ENGINE (pure functions, no DOM) ===================== */
const DAY = 86400000;
const MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const pad = n => String(n).padStart(2, '0');
function isoFromUTC(ms){ const d=new Date(ms); return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()); }
function dnum(iso){ if(!iso) return null; const [y,m,d]=iso.split('-').map(Number); return Date.UTC(y,m-1,d)/DAY; }
function isoFromDnum(n){ return isoFromUTC(n*DAY); }
function addDays(iso,n){ return isoFromDnum(dnum(iso)+n); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function weekdayISO(iso){ return new Date(dnum(iso)*DAY).getUTCDay(); } // 0=Sun
function weekStart(iso){ const w=(weekdayISO(iso)+6)%7; return addDays(iso,-w); } // Monday
function parseDateAny(v){
  if(v===null||v===undefined||v==='') return null;
  if(typeof v==='number'){ if(v<20000||v>80000) return null; return isoFromUTC(Date.UTC(1899,11,30)+Math.round(v)*DAY); }
  if(v instanceof Date && !isNaN(v)) return v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate());
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[A-Za-z]*[-\/ ](\d{2,4})$/);
  if(m){ const mo=MONTHS[m[2].toLowerCase()]; if(mo===undefined) return null; let y=+m[3]; if(y<100) y+=2000; return isoFromUTC(Date.UTC(y,mo,+m[1])); }
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/); if(m) return isoFromUTC(Date.UTC(+m[3],+m[2]-1,+m[1])); // dd/mm/yyyy
  return null;
}
const cleanHdr = h => String(h??'').replace(/[\r\n]+/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
const num = v => { if(v===null||v===undefined||v==='') return null; const n=typeof v==='number'?v:parseFloat(String(v).replace(/,/g,'')); return isNaN(n)?null:n; };
const txt = v => v===null||v===undefined ? '' : String(v).trim();

const FIELD_MAP = { customer:'cust','customer p/o #':'po','job #':'job','part no.':'part','die no.':'die',description:'desc',
  metallurgy:'met','uid #':'uid','poured date':'poured','ageing days':'age','to do qty':'qty','total black wt':'wt',
  'total black weight':'wt','agreed date':'agreed','job end date':'jobEnd','start date':'start',certification:'cert' };

/* Parse the Synchro "Master WIP" sheet (array of arrays) */
function parseSynchroRows(aoa){
  const warnings=[]; let hdrRow=-1;
  for(let r=0;r<Math.min(aoa.length,50);r++){ if(cleanHdr((aoa[r]||[])[0])==='customer'){ hdrRow=r; break; } }
  if(hdrRow<0) throw new Error("Header row not found: column A must contain 'Customer'. Is this the Synchro Master WIP export?");
  const col={}; (aoa[hdrRow]||[]).forEach((h,i)=>{ const f=FIELD_MAP[cleanHdr(h)]; if(f && col[f]===undefined) col[f]=i; });
  ['uid','qty','wt','start'].forEach(f=>{ if(col[f]===undefined) throw new Error("Required column missing in export: "+f); });
  const rows=[]; let area=''; const areas={};
  for(let r=hdrRow+1;r<aoa.length;r++){
    const row=aoa[r]||[]; const a=txt(row[0]);
    if(/^process area/i.test(a)){ area=txt(row[1])|| a.split(':').slice(1).join(':').trim(); areas[area]=areas[area]||0; continue; }
    const uid=txt(row[col.uid]); const qty=num(row[col.qty]);
    if(!uid || qty===null) continue;               // subtotal, total and blank rows
    if(!area){ warnings.push('Row '+(r+1)+' has no Process Area above it – skipped'); continue; }
    const g=f=>col[f]===undefined?null:row[col[f]];
    const wt=num(g('wt'))||0;
    const rec={ area, src:r+1, cust:txt(g('cust')), po:txt(g('po')), job:txt(g('job')), part:txt(g('part')), die:txt(g('die')),
      desc:txt(g('desc')), met:txt(g('met')).replace(/'/g,'').trim(), uid, poured:parseDateAny(g('poured')),
      pouredRaw:txt(g('poured')), age:num(g('age')), qty, wt, unitWt: qty>0? wt/qty : 0,
      agreed:parseDateAny(g('agreed')), jobEnd:parseDateAny(g('jobEnd')), startRaw:parseDateAny(g('start')), cert:txt(g('cert')) };
    rec.start = rec.startRaw || rec.poured;          // planning start date (fallback: poured date)
    const issues=[];
    if(!rec.startRaw) issues.push('Start Date blank'+(rec.poured?' (Poured Date used)':''));
    if(!rec.agreed) issues.push('Agreed Date blank');
    if(!rec.poured) issues.push(rec.pouredRaw? 'Poured: '+rec.pouredRaw : 'Poured Date blank');
    if(wt<=0) issues.push('Weight zero');
    rec.issues=issues;
    areas[area]++; rows.push(rec);
  }
  // unique keys per area + UID (duplicates get #2, #3)
  const occ={};
  rows.forEach(r=>{ const k=r.area+'|'+r.uid; occ[k]=(occ[k]||0)+1; r.occ=occ[k]; });
  rows.forEach(r=>{ if(occ[r.area+'|'+r.uid]>1) r.issues.push('Duplicate UID in export'); });
  return { rows, areas, warnings, hdrRow:hdrRow+1, columns:col };
}
function areaCode(area){ const m=String(area).match(/^\s*(\d{3,5})/); return m?m[1]:String(area).trim(); }
function keyOf(processId, uid, occ){ return processId+'|'+uid+(occ>1?'#'+occ:''); }

/* ---------- calendar ---------- */
function isWorkDay(iso, proc, holidays){
  const wd=(proc && proc.workDays) ? proc.workDays : [1,2,3,4,5,6];
  if(!wd.includes(weekdayISO(iso))) return false;
  return !(holidays||[]).some(h=>h.date===iso);
}
function nextWorkDay(iso, proc, holidays, n=1){ let d=iso, k=0, guard=0; while(k<n && guard++<400){ d=addDays(d,1); if(isWorkDay(d,proc,holidays)) k++; } return d; }
function firstWorkDayOnOrAfter(iso, proc, holidays){ return isWorkDay(iso,proc,holidays)? iso : nextWorkDay(iso,proc,holidays); }

/* ---------- lead time & delay ---------- */
function matchPattern(pattern, value){
  const p=String(pattern||'').trim(); if(!p) return true;
  const v=String(value||'').trim().toLowerCase();
  if(p.includes('*')){ const re=new RegExp('^'+p.toLowerCase().split('*').map(s=>s.replace(/[.+?^${}()|[\]\\]/g,'\\$&')).join('.*')+'$'); return re.test(v); }
  return p.toLowerCase()===v;
}
function leadTimeFor(item, leadTimes, onDate){
  const c=(leadTimes||[]).filter(l=>l.status!=='Inactive' && l.processId===item.processId && (!l.effectiveFrom || l.effectiveFrom<=onDate)
      && matchPattern(l.metallurgy,item.met) && matchPattern(l.part,item.part));
  if(!c.length) return null;
  c.sort((a,b)=> ((b.part?2:0)+(b.metallurgy?1:0)) - ((a.part?2:0)+(a.metallurgy?1:0)) || String(b.effectiveFrom||'').localeCompare(String(a.effectiveFrom||'')));
  const l=c[0]; const days = l.unit==='Hours' ? (+l.value)/24 : +l.value;
  return { days, value:+l.value, unit:l.unit||'Days', source: l.part?'Part':(l.metallurgy?'Metallurgy':'Process'), id:l.id };
}
function delayInfo(item, lt, today, amberDays){
  if(!lt || !item.start) return { target:null, delayDays:null, status:'LT not set' };
  const tgt = dnum(item.start)+lt.days;                      // fractional days allowed for hour-based LT
  const t = dnum(today);
  const target = isoFromDnum(Math.ceil(tgt));
  if(t>tgt) return { target, delayDays: Math.floor(t-tgt), status:'Delayed' };
  if(tgt-t<=amberDays) return { target, delayDays:0, status:'Due soon' };
  return { target, delayDays:0, status:'On track' };
}

/* ---------- priority ---------- */
// group: 0 = carry-forward, 1 = already delayed, 2 = FIFO
function prioCompare(a,b){
  return (a.group-b.group) || cmpD(a.item.start,b.item.start) || cmpD(a.item.agreed,b.item.agreed) || cmpD(a.item.jobEnd,b.item.jobEnd) || (a.item.src-b.item.src);
}
function cmpD(x,y){ if(x===y) return 0; if(!x) return 1; if(!y) return -1; return x<y?-1:1; }

/* Build the prioritised queue for one process.
   reported: map key -> qty already reported done but not yet moved in Synchro
   cfOpen: open carry-forward records {key, qty, priority:'High'|'Normal'}               */
function buildQueue(items, cfOpen, reported){
  const cfBy={}; (cfOpen||[]).forEach(c=>{ cfBy[c.key]=(cfBy[c.key]||[]).concat(c); });
  const q=[];
  items.forEach(it=>{
    let avail=Math.max(0, it.qty-(reported[it.key]||0));
    if(avail<=0) return;
    const cfs=cfBy[it.key]||[];
    const cfQty=Math.min(avail, cfs.filter(c=>c.priority!=='Normal').reduce((s,c)=>s+c.qty,0));
    if(cfQty>0){ q.push({item:it, qty:cfQty, group:0, cfIds:cfs.map(c=>c.id)}); avail-=cfQty; }
    if(avail>0) q.push({item:it, qty:avail, group: it.delay && it.delay.status==='Delayed'?1:2, cfIds: cfQty>0?[]:cfs.map(c=>c.id)});
  });
  q.sort(prioCompare);
  return q;
}
const GROUP_LABEL=['Carry-forward','Delayed','FIFO'];

/* Normal (FIFO + capacity) planning over a horizon of working days.
   Strict priority: once a line no longer fits, the day closes (lower lines never jump ahead). */
function planNormal(proc, queue, startDate, horizonDays, holidays, capFor){
  const days=[]; let d=firstWorkDayOnOrAfter(startDate,proc,holidays);
  const pending=queue.map(e=>({...e}));
  let i=0;
  for(let h=0; h<horizonDays && i<pending.length; h++){
    const cap=capFor(d)*1000; let used=0; const lines=[];
    if(!(cap>0)){ days.push({ date:d, capKg:0, usedKg:0, lines, locked:true }); d=nextWorkDay(d,proc,holidays); continue; }   // day already executed / no capacity
    while(i<pending.length){
      const e=pending[i]; const uw=e.item.unitWt||0;
      let fit = uw>0 ? Math.floor((cap-used)/uw+1e-9) : e.qty;
      if(fit<=0 && used===0 && uw>cap) fit=1;     // oversize piece: plan 1 so it is never stuck
      const take=Math.min(e.qty, Math.max(0,fit));
      if(take<=0) break;
      lines.push({ key:e.item.key, item:e.item, qty:take, kg:take*uw, group:e.group, cfIds:e.cfIds, prio:lines.length+1 });
      used+=take*uw; e.qty-=take;
      if(e.qty>0) break;                          // balance goes to next day
      i++;
    }
    days.push({ date:d, capKg:cap, usedKg:used, lines });
    d=nextWorkDay(d,proc,holidays);
  }
  const remaining=pending.slice(i).filter(e=>e.qty>0);
  return { days, remaining };
}

/* ---------- HT finite-capacity scheduler ---------- */
function recipeChain(met, recipes){
  return (recipes||[]).filter(r=>r.status==='Active' && String(r.metallurgies||'').split(',').some(p=>p.trim() && matchPattern(p,met)))
    .sort((a,b)=>(a.sequence||1)-(b.sequence||1));
}
function cycleHours(r){ const st=r.stages||[]; const s=st.reduce((t,x)=>t+(+x.hours||0),0); return s>0?s:(+r.cycleHours||0); }
function hoursBetween(a,b){ return (new Date(b)-new Date(a))/3600000; }
function addHours(isoDT,h){ return new Date(new Date(isoDT).getTime()+h*3600000).toISOString(); }

/* entries: prioritised queue for HT items; progress: key -> highest completed recipe sequence
   fixed: batches that must be kept (Running) ; returns new Planned batches + unplanned reasons */
function scheduleHT(queue, recipes, furnaces, fixed, progress, startDT, horizonHours){
  const horizonEnd=addHours(startDT,horizonHours);
  const free={}; const usable=[];
  (furnaces||[]).forEach(f=>{
    if(f.status==='Out of service') return;
    let t=startDT;
    if(f.availableFrom && f.availableFrom>t) t=f.availableFrom;
    if((f.status==='Maintenance'||f.status==='Breakdown') && !(f.availableFrom && f.availableFrom>startDT)) return; // no return date given
    (fixed||[]).filter(b=>b.furnaceId===f.id).forEach(b=>{ const e=b.status==='Running' ? (new Date(b.plannedEnd)>new Date(startDT)?b.plannedEnd:startDT) : b.plannedEnd; if(e>t) t=e; });
    free[f.id]=t; usable.push(f);
  });
  const inFixed={}; (fixed||[]).forEach(b=>b.items.forEach(x=>{ inFixed[x.key]=b; }));
  const unplanned=[]; const batches=[];
  const q=[];
  queue.forEach(e=>{
    const chain=recipeChain(e.item.met, recipes);
    if(!chain.length){ unplanned.push({e, reason:'Recipe unavailable', detail:'No active HT recipe for metallurgy '+(e.item.met||'(blank)')}); return; }
    const done=progress[e.item.key]||0;
    const next=chain.find(r=>(r.sequence||1)>done);
    if(!next){ unplanned.push({e, reason:'HT complete', detail:'All recipe stages already completed'}); return; }
    const fb=inFixed[e.item.key];
    if(fb){ unplanned.push({e, reason: fb.recipeId!==next.id?'Previous HT stage pending': fb.status==='Running'?'In furnace':'Already loaded', detail:(fb.status==='Running'?'In running batch ':'In planned load ')+fb.id+' ('+fb.recipeName+')'}); return; }
    if(chain.some(r=>(r.sequence||1)<(next.sequence||1) && (r.sequence||1)>done)){ unplanned.push({e, reason:'Previous HT stage pending'}); return; }
    q.push({...e, recipe:next});
  });
  let seq=0;
  while(q.length){
    const e=q[0]; const r=e.recipe;
    const comp=usable.filter(f=>!r.furnaces || !r.furnaces.length || r.furnaces.includes(f.id));
    if(!comp.length){
      const any=(furnaces||[]).some(f=>!r.furnaces||!r.furnaces.length||r.furnaces.includes(f.id));
      unplanned.push({e, reason: any?'Furnace unavailable':'Batch incompatibility', detail: any?'Compatible furnace not available':'Recipe allows no existing furnace'}); q.shift(); continue;
    }
    comp.sort((a,b)=> free[a.id]<free[b.id]?-1: free[a.id]>free[b.id]?1:0);
    const f=comp[0]; const limit=Math.min(+r.maxBatchKg||Infinity, +f.capacityKg||Infinity);
    if((e.item.unitWt||0)>limit){ unplanned.push({e, reason:'Capacity unavailable', detail:'One piece ('+Math.round(e.item.unitWt)+' kg) exceeds batch limit '+limit+' kg'}); q.shift(); continue; }
    const start=free[f.id];
    if(start>=horizonEnd){ unplanned.push({e, reason:'Capacity unavailable', detail:'No furnace time left within the planning horizon'}); q.shift(); continue; }
    const cyc=cycleHours(r);
    const b={ id:'B'+start.slice(2,10).replace(/-/g,'')+'-'+f.id+'-'+(++seq), furnaceId:f.id, recipeId:r.id, recipeName:r.name, cycleH:cyc,
      plannedStart:start, plannedEnd:addHours(start,cyc), status:'Planned', items:[], kg:0 };
    for(let k=0;k<q.length;k++){
      const x=q[k]; if(x.recipe.id!==r.id) continue;
      const uw=x.item.unitWt||0;
      const fit=uw>0?Math.floor((limit-b.kg)/uw+1e-9):x.qty; const take=Math.min(x.qty,fit);
      if(take<=0){ if(b.kg>=limit-1e-6) break; else continue; }
      b.items.push({ key:x.item.key, uid:x.item.uid, job:x.item.job, part:x.item.part, die:x.item.die||'', desc:x.item.desc||'', met:x.item.met, cust:x.item.cust||'', start:x.item.start||null, qty:take, kg:take*uw, unitWt:uw, group:x.group, cfIds:x.cfIds });
      b.kg+=take*uw; x.qty-=take;
    }
    for(let k=q.length-1;k>=0;k--) if(q[k].qty<=0) q.splice(k,1);
    free[f.id]=addHours(b.plannedEnd, +f.turnaroundH||0);
    batches.push(b);
  }
  return { batches, unplanned };
}

/* ---------- summaries ---------- */
function summariseDay(planLines, execLines){
  const s={pq:0,pkg:0,aq:0,akg:0,sq:0,skg:0,lines:0,done:0,reasons:{}};
  (planLines||[]).forEach(l=>{ s.pq+=l.qty; s.pkg+=l.kg; s.lines++; });
  (execLines||[]).forEach(x=>{ s.aq+=x.actualQty; s.akg+=x.actualKg; s.sq+=x.shortQty; s.skg+=x.shortKg; if(x.shortQty>0 && x.reason){ const r=s.reasons[x.reason]||(s.reasons[x.reason]={q:0,kg:0,n:0}); r.q+=x.shortQty; r.kg+=x.shortKg; r.n++; } if(x.shortQty===0) s.done++; });
  return s;
}

/* ===================== SHA-256 (works on http intranet too) ===================== */
function sha256(ascii){
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  const mp=Math.pow, maxWord=mp(2,32); let result='', i, j;
  const words=[], bitLen=ascii.length*8; const hash=[], k=[]; let primeCounter=0; const isC={};
  for(let c=2;primeCounter<64;c++){ if(!isC[c]){ for(i=0;i<313;i+=c) isC[i]=c; if(primeCounter<8) hash[primeCounter]=(mp(c,.5)*maxWord)|0; k[primeCounter++]=(mp(c,1/3)*maxWord)|0; } }
  ascii=unescape(encodeURIComponent(ascii)); const L=ascii.length*8;
  ascii+='\x80'; while(ascii.length%64-56) ascii+='\x00';
  for(i=0;i<ascii.length;i++){ j=ascii.charCodeAt(i); words[i>>2]|=j<<((3-i)%4)*8; }
  words[words.length]=((L/maxWord)|0); words[words.length]=(L);
  for(j=0;j<words.length;){
    const w=words.slice(j,j+=16); const old=hash.slice(0,8);
    for(i=0;i<64;i++){
      const w15=w[i-15], w2=w[i-2]; const a=hash[0], e=hash[4];
      const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash.unshift((t1+t2)|0); hash[4]=(hash[4]+t1)|0; hash.length=8;
    }
    for(i=0;i<8;i++) hash[i]=(hash[i]+old[i])|0;
  }
  for(i=0;i<8;i++) for(j=3;j+1;j--){ const b=(hash[i]>>(j*8))&255; result+=((b<16)?0:'')+b.toString(16); }
  return result;
}

  try{ await Store.update('audit/'+ts.slice(0,7), d=>{ d=d||{list:[]}; d.list.push({ts,user:S.user?S.user.username:'-',action,detail}); return d; }); }catch(e){ console.warn(e); }
}
function csv(name, rows){
  const s=rows.map(r=>r.map(v=>{ v=v===null||v===undefined?'':String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'})); a.download=name; a.click();
}

/* ===================== LOAD & DERIVE ===================== */
async function loadConfig(){ S.cfg=await Store.get('config'); if(!S.cfg){ S.cfg=defaultConfig(); await Store.set('config',S.cfg); }
  if(!S.cfg.routes) S.cfg.routes=defaultRoutes(); S.cfg.settings.wipMode=S.cfg.settings.wipMode||'Synchro snapshot'; S.cfg.settings.entryStages=S.cfg.settings.entryStages||'1060'; }
async function saveConfig(mut, what){
  S.cfg=await Store.update('config', c=>{ c=c||defaultConfig(); mut(c); return c; });
  if(what) await audit('Master change', what);
}
async function loadAll(){
  await loadConfig();
  S.wipMeta=await Store.get('wip/meta');
  S.wipRows=await readWip(S.wipMeta);
  S.cfOpen=((await Store.get('cf/open'))||{list:[]}).list;
  S.ht=(await Store.get('ht/active'))||{batches:[]};
  S.htProgress=(await Store.get('ht/progress'))||{};
  const y=+E.todayISO().slice(0,4);
  const [s1,s0,n1,n0]=await Store.getMany(['sum/'+y,'sum/'+(y-1),'snap/'+y,'snap/'+(y-1)]);
  S.sums=Object.assign({}, (s0||{}).d||{}, (s1||{}).d||{});
  S.snaps=Object.assign({}, (n0||{}).d||{}, (n1||{}).d||{});
  S.planIdx=((await Store.get('planidx'))||{dates:{}}).dates;
  await loadReported();
  await loadPlannedKeys();
  derive(); S.loadedAt=Date.now();
}
async function loadPlannedKeys(){
  S.planKeys={}; const today=E.todayISO();
  const paths=[]; Object.entries(S.planIdx||{}).forEach(([d,pids])=>{ if(d>=today) pids.forEach(p=>paths.push('plan/'+d+'/'+p)); });
  (await Store.getMany(paths)).forEach(doc=>{ if(doc) (doc.lines||[]).forEach(l=>{ S.planKeys[l.key]=(S.planKeys[l.key]||0)+l.qty; }); });
}
/* actuals already reported but probably not yet moved in Synchro (protects against planning an item twice) */
async function loadReported(){
  S.reported={};
  if(!S.wipMeta || routingOn()) return;      // routing mode: completed qty has already left the stage
  const from=E.addDays(S.wipMeta.snapshotDate, -(+S.cfg.settings.postingLag||0)); const to=E.todayISO();
  const dates=[]; for(let d=from; d<=to && dates.length<8; d=E.addDays(d,1)) dates.push(d);
  const paths=[]; dates.forEach(d=>S.cfg.processes.forEach(p=>paths.push('exec/'+d+'/'+p.id)));
  const docs=await Store.getMany(paths);
  docs.forEach(doc=>{ if(!doc) return; (doc.lines||[]).forEach(l=>{ if(doc.status==='Submitted'||l.batchId) S.reported[l.key]=(S.reported[l.key]||0)+(+l.actualQty||0); }); });
}
function derive(){
  const today=E.todayISO(), amber=+S.cfg.settings.amberDays||0;
  const cfBy={}; S.cfOpen.forEach(c=>{ (cfBy[c.key]=cfBy[c.key]||[]).push(c); });
  const inBatch={}; S.ht.batches.forEach(b=>b.items.forEach(x=>{ inBatch[x.key]=b; }));
  const latestPlan={}; Object.entries(S.planIdx||{}).forEach(([d,pids])=>{ if(d>=today) pids.forEach(p=>latestPlan[p]=true); });
  S.wip=S.wipRows.map(r=>{
    const it={...r}; it.processId=r.processId; it.key=r.key;
    it.lt=E.leadTimeFor(it,S.cfg.leadTimes,today);
    if(!it.lt || it.lt.source==='Process'){ const op=routeOpFor(it); if(op && +op.lt>0) it.lt={days:+op.lt, value:+op.lt, unit:'Days', source:'Routing'}; }
    it.delay=E.delayInfo(it,it.lt,today,amber);
    it.reported=S.reported[it.key]||0; it.plannable=Math.max(0,it.qty-it.reported);
    it.cf=cfBy[it.key]||[]; it.batch=inBatch[it.key]||null;
    it.completed=it.plannable<=0;
    it.planned=!!it.batch || (S.planKeys && S.planKeys[it.key]);
    return it;
  });
}
const wipFor=pid=>S.wip.filter(w=>w.processId===pid);
const wipByKey=k=>{ if(!S._wk||S._wkSrc!==S.wip){ S._wk={}; S.wip.forEach(w=>S._wk[w.key]=w); S._wkSrc=S.wip; } return S._wk[k]; };
const toolOf=l=>l.die || (wipByKey(l.key)||{}).die || '';
const descOf=l=>l.desc || (wipByKey(l.key)||{}).desc || '';

async function boot(){
  const root=$('#root');
  root.innerHTML='<div class="login"><div style="color:#fff">Starting…</div></div>';
  clearTimeout(S.watchdog); S.watchdog=setTimeout(()=>{ if(!S.user && !document.getElementById('lf') && !document.getElementById('cf')) showStuck(); }, 25000);
  try{ await Store.init();
    if(Store.mode==='folder') bootMsg('Looking for the data folder saved on this PC…');
    if(Store.mode==='folder'){ if(!Store.folderSupported()) return showFolderUnsupported(); if(!(await Store.folderReady())) return showConnectFolder();
      if(!S.folderChecked){ await folderSelfTest(); S.folderChecked=true; } }
    if(Store.mode!=='firebase'){ bootMsg('Loading settings…'); await withTimeout(loadConfig(), 30000, 'reading the settings file (config.json)'); } else S.cfg=S.cfg||defaultConfig(); }
  catch(e){ console.error(e); return showStartError(e); }
  if(Store.mode==='firebase'){
    Store.auth.onAuthStateChanged(fu=>{ if(fu && !S.busySetup) afterFbSignIn(fu); else if(!fu){ S.busySetup=false; const m=S.loginMsg; S.loginMsg=null; showLogin(m); } });
    return;
  }
  const sess=sessionStorage.getItem('wipUser');
  const u=sess && S.cfg.users.find(x=>x.username===sess);
  if(u){ S.user=u; startApp(); } else showLogin();
}
const bootMsg=t=>{ const r=$('#root'); r.innerHTML=`<div class="login"><div class="panel" style="max-width:460px;text-align:center"><div class="glow" style="margin-bottom:12px"></div><b>${esc(t)}</b><div class="small muted" style="margin-top:6px">${Store.dir?'Data folder: '+esc(Store.dir.name):''}</div></div></div>`; };
function withTimeout(p, ms, what){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('No answer from the network folder while '+what+' (waited '+Math.round(ms/1000)+' s).')),ms))]); }
/* checks read / write / delete on the shared folder once per session and tells the user exactly which step fails */
async function folderSelfTest(){
  const d=Store.dir; const name='_connection_test_'+Store.me+'.json';
  bootMsg('Checking the data folder… (1/4 reading)');
  await withTimeout((async()=>{ for await (const _ of d.keys()) break; })(), 20000, 'listing the folder');
  bootMsg('Checking the data folder… (2/4 writing)');
  await withTimeout(Store.fwrite(name,{t:Date.now()}), 20000, 'writing a test file');
  bootMsg('Checking the data folder… (3/4 reading back)');
  const back=await withTimeout(Store.fread(name), 20000, 'reading the test file');
  if(!back) throw new Error('The test file could not be read back from the folder.');
  bootMsg('Checking the data folder… (4/4 cleaning up)');
  await withTimeout(d.removeEntry(name), 20000, 'deleting the test file');
}

function suggestedDataPath(){              // the "data" folder next to this index.html

  const dir=decodeURIComponent(location.pathname).replace(/\/[^\/]*$/,'');
  if(location.host) return '\\\\'+location.host+dir.replace(/\//g,'\\')+'\\data';
  return dir.replace(/^\//,'').replace(/\//g,'\\')+'\\data';
}

/* ---------- Firebase sign-in, first administrator and user accounts ---------- */
async function getAccess(){ const d=await Store.db.collection(COLLECTION).doc('access').get(); return d.exists?d.data():null; }
async function afterFbSignIn(fu){
  try{
    const acc=await getAccess();
    const role=acc && acc.uids && acc.uids[fu.uid];
    if(!role){ S.loginMsg='This account is not authorised. Ask the administrator.'; await Store.auth.signOut(); return; }
    await loadConfig();
    const rec=S.cfg.users.find(u=>u.uid===fu.uid) || {name:fu.email.split('@')[0], username:fu.email.split('@')[0], processes:[]};
    S.user={...rec, role}; startApp();
  }catch(e){ console.error(e); S.loginMsg='Could not open the database: '+e.message+'. Check the Firestore security rules.'; await Store.auth.signOut(); }
}
async function fbFirstSetup(){
  const raw=$('#lu').value, un=normUser(raw), pw=$('#lp').value, keep={u:raw,p:pw};
  if(!un) return showLogin('First type a user name (e.g. ajay) and a password in the boxes above, then click First-time setup.', keep);
  if(!/^[a-z0-9._-]{3,30}$/.test(un)) return showLogin('User name “'+raw+'” is not allowed. Use 3–30 letters or digits, e.g. ajay or ajay.kumar (no @ or special characters).', keep);
  if(pw.length<6) return showLogin('The password must have at least 6 characters (you typed '+pw.length+').', keep);
  S.busySetup=true;
  try{
    const cred=await Store.auth.createUserWithEmailAndPassword(un+'@'+LOGIN_DOMAIN, pw);
    if(await getAccess()){ S.loginMsg='This system is already set up. Sign in, or ask the administrator for an account.'; await cred.user.delete(); return; }
    await Store.db.collection(COLLECTION).doc('access').set({uids:{[cred.user.uid]:'Admin'}});
    const cfg=defaultConfig(); cfg.users=[{id:uidGen('U'), uid:cred.user.uid, name:'Administrator', username:un, role:'Admin', processes:[]}];
    await Store.set('config', cfg);
    S.busySetup=false; await afterFbSignIn(cred.user);
    await audit('First-time setup', 'Administrator '+un+' created');
  }catch(e){ S.busySetup=false; const c=e.code||'';
    showLogin(c==='auth/email-already-in-use'?'That user name already exists. Click Sign in. (If sign-in then says “not authorised”, delete the user in Firebase › Authentication › Users and run First-time setup again.)'
      :/operation-not-allowed/.test(c)?'Email/Password sign-in is not enabled. Firebase › Authentication › Sign-in method › Email/Password › Enable, then try again.'
      :/api-key/.test(c)?'Firebase API key in index.html is not valid – copy it again from the Firebase console.'
      :/permission|insufficient/i.test(c+' '+e.message)?'The database refused access. Firebase › Firestore › Rules: paste firestore.rules and Publish. Then delete the half-created user (Authentication › Users) and try again.'
      :/unauthorized-domain/.test(c)?'This web address is not allowed. Firebase › Authentication › Settings › Authorized domains › add your github.io address.'
      :'Setup failed: '+(c?c+' – ':'')+e.message, keep); }
}

async function fbCreateAccount(username, pw){          // a second Firebase app instance keeps the administrator signed in

}

function setupBanners(){
  const out=[];
  if(Store.mode==='local') out.push('<div class="banner info">Trial mode: data is stored in this browser only. For shop-floor users on several PCs, set DATA_STORAGE to \'folder\' or add the Firebase configuration at the top of index.html.</div>');
  if(S.user.role==='Admin'){
    if(Store.mode!=='firebase' && S.cfg.users.some(u=>u.demo)) out.push('<div class="banner warn">Trial accounts with PIN 1234 are still active. Change or delete them in Masters › Users before go-live.</div>');
    const noLT=sortedProcs().filter(p=>p.active && !S.cfg.leadTimes.some(l=>l.processId===p.id && l.status!=='Inactive' && !l.metallurgy && !l.part));
    if(noLT.length) out.push(`<div class="banner warn">No approved lead time for ${noLT.map(p=>esc(p.id+' '+p.name)).join(', ')}. Delay status shows “LT not set” for them until you enter a stage lead time in Masters › Lead times.</div>`);
    const draft=S.cfg.recipes.filter(r=>r.status==='Draft');
    if(draft.length) out.push(`<div class="banner warn">${draft.length} HT recipe(s) are in Draft, so their castings cannot be loaded to a furnace yet. Review the cycle times and approve them in Masters › HT recipes (or with the Approve button in HT planning).</div>`);
    if(routingOn() && !(S.cfg.routes||[]).some(r=>r.active!==false && !r.part && !r.metallurgy && !r.customer)) out.push('<div class="banner warn">Routing mode is on but there is no general route (a rule without Part / Metallurgy / Customer). Items not matching a special rule cannot move to their next stage. Add one in Masters › Routing.</div>');
    const inactiveNew=S.cfg.processes.filter(p=>p.autoAdded && !p.active);
    if(inactiveNew.length) out.push(`<div class="banner warn">New process area(s) found in Synchro: ${inactiveNew.map(p=>esc(p.synchroName||p.id)).join(', ')}. Configure and activate them in Masters › Processes.</div>`);
  }
  return out.join('');
}
function modal(title, body, actions){
  const d=document.createElement('dialog');
  d.innerHTML=`<div class="dlg-h"><h3 style="margin:0">${esc(title)}</h3><button class="btn ghost sm" data-x>Close</button></div><div class="dlg-b">${body}</div><div class="dlg-f"></div>`;
  document.body.appendChild(d);
  const f=d.querySelector('.dlg-f');
  (actions||[]).forEach(a=>{ const b=document.createElement('button'); b.className='btn '+(a.cls||''); b.textContent=a.label; b.onclick=async()=>{ if(a.fn){ const r=await a.fn(d); if(r===false) return; } d.close(); d.remove(); }; f.appendChild(b); });
  d.querySelector('[data-x]').onclick=()=>{ d.close(); d.remove(); };
  d.showModal(); return d;
}

/* ===================== WIP STORAGE (one document per process) ===================== */
const routingOn=()=>S.cfg.settings.wipMode==='Routing';
const entryStages=()=>String(S.cfg.settings.entryStages||'1060').split(',').map(x=>x.trim()).filter(Boolean);
async function readWip(meta){
  if(!meta) return [];
  if(meta.layout==='byProcess'){ const docs=await Store.getMany((meta.pids||[]).map(p=>'wipp/'+p)); return docs.flatMap(d=>(d&&d.rows)||[]); }
  const parts=await Store.getMany([...Array(meta.chunks||0).keys()].map(i=>'wip/'+i)); return parts.flatMap(p=>(p&&p.rows)||[]);   // older layout
}
async function reloadWip(){ S.wipMeta=await Store.get('wip/meta'); S.wipRows=await readWip(S.wipMeta); await loadReported(); derive(); }
async function deleteLegacyChunks(meta){ if(meta && meta.layout!=='byProcess') for(let i=0;i<(meta.chunks||0);i++) await Store.del('wip/'+i); }
async function replaceWip(rows, info){                       // snapshot mode / initial load: the file becomes the WIP
  const by={}; rows.forEach(r=>{ (by[r.processId]=by[r.processId]||[]).push(r); });
  const old=S.wipMeta;
  for(const [pid,l] of Object.entries(by)) await Store.set('wipp/'+pid,{rows:l});
  for(const pid of ((old&&old.pids)||[])) if(!by[pid]) await Store.del('wipp/'+pid);
  await deleteLegacyChunks(old);
  const meta={...info, layout:'byProcess', pids:Object.keys(by), rows:rows.length, kg:rows.reduce((s,r)=>s+r.wt,0)};
  await Store.set('wip/meta',meta); return meta;
}
async function addPidToMeta(pids, extra){ return Store.update('wip/meta', m=>{ m=m||{layout:'byProcess',pids:[]}; m.layout='byProcess'; m.pids=Array.from(new Set([...(m.pids||[]),...pids])); return Object.assign(m, extra||{}); }); }
/* Delete the uploaded WIP and everything planned on it. Days that already have actuals stay as history unless a full reset is chosen. */
async function openPlanDays(){
  const idx=S.planIdx||{}; const pairs=[]; Object.entries(idx).forEach(([d,ps])=>ps.forEach(pid=>pairs.push([d,pid])));
  const ex=await Store.getMany(pairs.map(([d,pid])=>'exec/'+d+'/'+pid));
  const open=[], done=[];
  pairs.forEach((pr,i)=>{ const x=ex[i]; const has=!!(x && (x.status==='Submitted' || (x.lines||[]).some(l=>l.actualQty!==null&&l.actualQty!==undefined&&l.actualQty!==''))); (has?done:open).push(pr); });
  return {open, done};
}
async function deleteWip(opt){
  opt=opt||{}; const meta=S.wipMeta; const log=[];
  if(meta){ for(const pid of (meta.pids||[])) await Store.del('wipp/'+pid); await deleteLegacyChunks(meta); await Store.del('wip/meta'); }
  log.push('WIP lines deleted');
  const {open, done}=await openPlanDays();
  const kill=opt.full? open.concat(done) : open;
  for(const [d,pid] of kill){ await Store.del('plan/'+d+'/'+pid); await Store.del('exec/'+d+'/'+pid); }
  await Store.update('planidx', x=>{ x=x||{dates:{}}; kill.forEach(([d,pid])=>{ x.dates[d]=(x.dates[d]||[]).filter(q=>q!==pid); if(!x.dates[d].length) delete x.dates[d]; }); return x; });
  const years=[...new Set(kill.map(([d])=>d.slice(0,4)))];
  for(const y of years) await Store.update('sum/'+y, x=>{ x=x||{d:{}}; kill.forEach(([d,pid])=>{ if(d.startsWith(y) && x.d[d]){ delete x.d[d][pid]; if(!Object.keys(x.d[d]).length) delete x.d[d]; } }); return x; });
  log.push(kill.length+' plan day(s) deleted'+(opt.full?'':' (days with actuals kept: '+done.length+')'));
  const nHT=(S.ht.batches||[]).length;
  await Store.set('ht/active',{batches:[], unplanned:[]}); await Store.set('ht/progress',{}); log.push(nHT+' HT load(s) deleted');
  const nCF=S.cfOpen.length; await Store.set('cf/open',{list:[]}); log.push(nCF+' open carry-forward(s) deleted');
  if(opt.forget || opt.full) await Store.update('seen', d=>({m:{}}));
  if(opt.full){
    const y=+E.todayISO().slice(0,4); const months=[]; for(let i=0;i<36;i++){ const t=new Date(y, new Date().getMonth()-i, 1); months.push(t.getFullYear()+'-'+pad(t.getMonth()+1)); }
    for(const mo of months) for(const k of ['cf/closed/','ht/done/','moves/','wip/done/']) await Store.del(k+mo);
    for(const yy of [y,y-1,y-2]) for(const k of ['sum/','snap/','uploads/']) await Store.del(k+yy);
    await Store.del('planidx'); log.push('all actuals, dashboards and movement history deleted (full reset)');
  }
  await audit('Delete WIP', log.join('; '));
  await loadAll();
  return log;
}

/* ===================== ROUTING: completed quantity moves to the next stage ===================== */
const routeSteps=r=>(r.ops&&r.ops.length)? [...r.ops].sort((a,b)=>(+a.op||0)-(+b.op||0)).map(o=>o.pid) : String(r.steps||'').split(/[>,→\s]+/).map(x=>x.trim()).filter(Boolean);
function normRoute(r){ if(!r.ops||!r.ops.length) r.ops=routeSteps(r).map((pid,i)=>{ const n=procName(pid); return {op:(i+1)*10, pid, desc:n, type:/subcontract/i.test(n)?'Subcontract':'In-house', lt:''}; }); return r; }
function routeOpFor(row){ const r=routeFor(row); if(!r||!r.ops) return null; return r.ops.find(o=>o.pid===row.processId)||null; }
function routeFor(row){
  const c=(S.cfg.routes||[]).filter(r=>r.active!==false && E.matchPattern(r.part,row.part) && E.matchPattern(r.metallurgy,row.met) && E.matchPattern(r.customer,row.cust));
  c.sort((a,b)=>((b.part?4:0)+(b.metallurgy?2:0)+(b.customer?1:0))-((a.part?4:0)+(a.metallurgy?2:0)+(a.customer?1:0)));
  return c[0]||null;
}
function nextStage(row, pid){ const r=routeFor(row); if(!r) return {to:null, note:'No routing rule'}; const st=routeSteps(r); const i=st.indexOf(pid);
  if(i<0) return {to:null, note:'Stage '+pid+' not in route '+r.name}; return {to:st[i+1]||null, note:st[i+1]?r.name:'Route complete', route:r.name}; }
const uidPart=key=>key.split('|').slice(1).join('|');
/* reqs: [{key, qty, to?}] – to given = manual transfer; otherwise the routing decides */
async function transferWip(date, pid, reqs, note){
  if(!reqs.length) return [];
  const moves=[];
  await Store.update('wipp/'+pid, d=>{ d=d||{rows:[]}; moves.length=0;
    reqs.forEach(q=>{ const r=d.rows.find(x=>x.key===q.key); if(!r) return; const take=Math.min(+q.qty||0, r.qty); if(take<=0) return;
      const ns=q.to!==undefined?{to:q.to||null, note:note||'Manual transfer'}:nextStage(r,pid);
      moves.push({key:r.key, uid:r.uid, from:pid, to:ns.to||'', qty:take, note:ns.note, row:{...r}}); r.qty-=take; r.wt=r.qty*(r.unitWt||0); });
    d.rows=d.rows.filter(x=>x.qty>0); return d; });
  const byTo={}; moves.forEach(mv=>{ (byTo[mv.to]=byTo[mv.to]||[]).push(mv); });
  for(const [to,l] of Object.entries(byTo)){
    if(!to){ await Store.update('wip/done/'+date.slice(0,7), d=>{ d=d||{rows:[]}; l.forEach(mv=>d.rows.push({...mv.row, qty:mv.qty, wt:mv.qty*(mv.row.unitWt||0), finishedOn:date, lastStage:pid, note:mv.note})); return d; }); continue; }
    const tp=procById(to);
    await Store.update('wipp/'+to, d=>{ d=d||{rows:[]};
      l.forEach(mv=>{ const nk=to+'|'+uidPart(mv.key); mv.toKey=nk; const ex=d.rows.find(x=>x.key===nk);
        if(ex){ ex.qty+=mv.qty; ex.wt=ex.qty*(ex.unitWt||0); }
        else d.rows.push({...mv.row, key:nk, processId:to, area:(tp&&tp.synchroName)||(to+'-'+(tp?tp.name:'')), qty:mv.qty, wt:mv.qty*(mv.row.unitWt||0),
          start:date, startRaw:date, firstSeen:date, movedFrom:pid, movedOn:date, issues:[]}); });
      return d; });
  }
  await addPidToMeta(Object.keys(byTo).filter(Boolean));
  const ts=new Date().toISOString();
  await Store.update('moves/'+date.slice(0,7), d=>{ d=d||{list:[]}; moves.forEach(mv=>d.list.push({date, ts, uid:mv.uid, key:mv.key, from:mv.from, to:mv.to, qty:mv.qty, note:mv.note, by:S.user.username})); return d; });
  return moves.map(mv=>({key:mv.key, toKey:mv.toKey||'', from:mv.from, to:mv.to, qty:mv.qty, row:mv.row}));
}
/* undo moves made by a submission that is reopened (only what is still waiting in the next stage) */
async function reverseMoves(date, moves){
  let back=0, missing=0;
  for(const mv of moves||[]){
    let got=0;
    if(mv.to){ await Store.update('wipp/'+mv.to, d=>{ d=d||{rows:[]}; got=0; const r=d.rows.find(x=>x.key===mv.toKey); if(r){ got=Math.min(r.qty,mv.qty); r.qty-=got; r.wt=r.qty*(r.unitWt||0); d.rows=d.rows.filter(x=>x.qty>0); } return d; }); }
    else got=0;
    if(got>0){ await Store.update('wipp/'+mv.from, d=>{ d=d||{rows:[]}; const r=d.rows.find(x=>x.key===mv.key); if(r){ r.qty+=got; r.wt=r.qty*(r.unitWt||0); } else d.rows.push({...mv.row, qty:got, wt:got*(mv.row.unitWt||0)}); return d; }); back+=got; }
    if(got<mv.qty) missing+=mv.qty-got;
  }
  await addPidToMeta([...new Set((moves||[]).map(m=>m.from))]);
  return {back, missing};
}

function toWipRow(r, seenMap, snapDate){
  const pid=E.areaCode(r.area); const key=E.keyOf(pid,r.uid,r.occ);
  return {key, processId:pid, area:r.area, src:r.src, cust:r.cust, po:r.po, job:r.job, part:r.part, die:r.die, desc:r.desc, met:r.met, uid:r.uid,
    poured:r.poured, pouredRaw:r.pouredRaw, age:r.age, qty:r.qty, wt:r.wt, unitWt:r.unitWt, agreed:r.agreed, jobEnd:r.jobEnd, start:r.start,
    startRaw:r.startRaw, cert:r.cert, issues:r.issues, firstSeen:(seenMap&&seenMap[key])||snapDate};
}
async function showUploadPreview(p){
  const known=new Set(S.cfg.processes.map(x=>x.id)); const r=routingOn(); const ent=entryStages();
  const seen=r? (((await Store.get('seen'))||{m:{}}).m) : {};
  const inApp=new Set(S.wip.map(w=>uidPart(w.key)));
  const isNew=x=>{ const u=uidPart(E.keyOf(E.areaCode(x.area),x.uid,x.occ)); return !inApp.has(u) && !seen['U:'+u]; };
  const entryRows=p.rows.filter(x=>ent.includes(E.areaCode(x.area)));
  const newRows=entryRows.filter(isNew);
  const rowsA=Object.entries(p.areas).map(([a,n])=>{ const id=E.areaCode(a); const kg=p.rows.filter(x=>x.area===a).reduce((s,x)=>s+x.wt,0);
    const use=!r?'<span class="chip ok">Loaded</span>':ent.includes(id)?`<span class="chip ok">${p.rows.filter(x=>x.area===a&&isNew(x)).length} new lines added</span>`:'<span class="chip mute">Ignored (routing fills this stage)</span>';
    return `<tr><td>${esc(a)}</td><td>${known.has(id)?'<span class="chip blue">'+esc(id)+'</span>':'<span class="chip warn">New process – added inactive</span>'}</td><td>${use}</td><td class="r num">${fmt(n)}</td><td class="r num">${mt(kg)}</td></tr>`; }).join('');
  const issues=p.rows.filter(x=>x.issues.length);
  $('#uprev').innerHTML=`<div class="banner info">Sheet “${esc(p.sheet)}”, header on row ${p.hdrRow}: ${fmt(p.rows.length)} WIP lines, ${mt(p.rows.reduce((s,x)=>s+x.wt,0))} MT. Total Black Wt is treated as the line total (weight per piece = Total Black Wt ÷ To Do Qty).</div>
    <div class="tbl-wrap"><table><thead><tr><th>Process area</th><th>Process</th><th>Use</th><th class="r">Lines</th><th class="r">MT</th></tr></thead><tbody>${rowsA}</tbody></table></div>
    ${issues.length?`<details style="margin-top:10px"><summary>${issues.length} lines with data notes (kept, flagged)</summary><div class="tbl-wrap" style="max-height:260px;margin-top:8px"><table><tbody>${issues.map(x=>`<tr><td>${esc(x.area)}</td><td>${esc(x.uid)}</td><td>${esc(x.issues.join('; '))}</td></tr>`).join('')}</tbody></table></div></details>`:''}
    ${r?`<div class="panel" style="margin-top:12px;background:var(--soft)"><b>Routing mode</b> – ${fmt(newRows.length)} new ${esc(ent.join(', '))} line(s) will be added (${fmt(entryRows.length-newRows.length)} already in the system or imported before are skipped). Other stages in the file are ignored.
       <label class="small" style="display:block;margin-top:8px"><input type="checkbox" id="uinit"> <b>Initial load</b> – replace the whole app WIP with ALL stages from this file (use once at go-live, or to re-align with Synchro).</label></div>`:''}
    <div class="row" style="margin-top:14px"><button class="btn heat" id="ugo">${r?'Add new lines to WIP':'Replace current WIP with this file'}</button><span class="small muted">Plans, actuals and carry-forwards already saved are kept.</span></div>`;
  if($('#uinit')) $('#uinit').onchange=e=>{ $('#ugo').textContent=e.target.checked?'Initial load: replace app WIP with all stages':'Add new lines to WIP'; };
  $('#ugo').onclick=()=>commitUpload(p, $('#ud').value||E.todayISO(), {initial:!!($('#uinit')&&$('#uinit').checked), newRows});
}
async function commitUpload(p, snapDate, opt){
  opt=opt||{}; const btn=$('#ugo'); btn.disabled=true; const label=btn.textContent; btn.textContent='Saving…';
  const r=routingOn(); const mode=!r?'Snapshot':opt.initial?'Routing – initial load':'Routing – new lines';
  try{
    const newAreas=Object.keys(p.areas).filter(a=>!S.cfg.processes.some(x=>x.id===E.areaCode(a)));
    await saveConfig(c=>{
      Object.keys(p.areas).forEach(a=>{ const id=E.areaCode(a); const ex=c.processes.find(x=>x.id===id);
        if(ex){ ex.synchroName=a; } else c.processes.push({id, name:a.replace(/^\s*\d+\s*-\s*/,''), synchroName:a, type:'Normal', capacityMT:c.settings.defaultCapMT||5, workDays:[1,2,3,4,5,6], active:false, autoAdded:true, seq:90, partial:true}); });
    }, newAreas.length?'New process areas from Synchro: '+newAreas.join(', '):null);
    const src=(r && !opt.initial)? opt.newRows : p.rows;
    const seen=await Store.update('seen', d=>{ d=d||{m:{}}; src.forEach(x=>{ const k=E.keyOf(E.areaCode(x.area),x.uid,x.occ); if(!d.m[k]) d.m[k]=snapDate; d.m['U:'+uidPart(k)]=snapDate; }); return d; });
    const rows=src.map(x=>toWipRow(x, seen.m, snapDate));
    const info={file:p.file, snapshotDate:snapDate, uploadedAt:new Date().toISOString(), by:S.user.username, mode};
    if(!r || opt.initial){
      await replaceWip(rows, info);
      const keys=new Set(rows.map(x=>x.key));
      await updateCF(list=>{ list.filter(c=>!keys.has(c.key)).forEach(c=>{ c.status='Closed'; c.closeNote=(r?'Not in initial load':'Left stage in Synchro')+' ('+snapDate+')'; c.closedAt=new Date().toISOString(); }); });
    } else {
      const by={}; rows.forEach(x=>{ (by[x.processId]=by[x.processId]||[]).push(x); });

async function updateCF(fn){

  const doc=await Store.update('cf/open', d=>{ d=d||{list:[]}; const ret=fn(d.list)||[]; closed=d.list.filter(c=>c.status==='Closed'||c.status==='Superseded'); d.list=d.list.filter(c=>!(c.status==='Closed'||c.status==='Superseded')); return d; });
  if(closed.length){ const byM={}; closed.forEach(c=>{ (byM[c.fromDate.slice(0,7)]=byM[c.fromDate.slice(0,7)]||[]).push(c); });
    for(const [mo,l] of Object.entries(byM)) await Store.update('cf/closed/'+mo, d=>{ d=d||{list:[]}; d.list.push(...l); return d; }); }

/* ===================== DAILY PLAN ===================== */
const capFor=(pid,date)=>{ const o=S.cfg.capOverrides[date+'|'+pid]; const p=procById(pid); return o!==undefined&&o!==null&&o!==''? +o : (p&&p.capacityMT!==''&&p.capacityMT!==undefined ? +p.capacityMT : +S.cfg.settings.defaultCapMT||5); };
/* Day-wise plan over several days. Castings already planned on an earlier day whose actuals are not submitted stay
   reserved for that day, so the same casting is never planned twice. Days that already have actuals are kept as they are. */
async function buildPreview(start, nDays){
  const today=E.todayISO(); const idx=S.planIdx||{};
  const procs=sortedProcs().filter(p=>p.active);
  const relDates=Object.keys(idx).filter(d=>d>=E.addDays(start,-14)).sort();
  const paths=[]; relDates.forEach(d=>idx[d].forEach(pid=>{ paths.push('plan/'+d+'/'+pid); paths.push('exec/'+d+'/'+pid); }));
  const docs=await Store.getMany(paths); const P={}, X={}; let k=0;
  relDates.forEach(d=>idx[d].forEach(pid=>{ P[d+'|'+pid]=docs[k++]; X[d+'|'+pid]=docs[k++]; }));
  const hasActuals=(d,pid)=>{ const x=X[d+'|'+pid]; return !!(x && (x.status==='Submitted' || (x.lines||[]).some(l=>l.actualQty!==null&&l.actualQty!==undefined&&l.actualQty!==''))); };
  const out={}; let endDate=start;
  for(const p of procs.filter(p=>p.type!=='HT')){
    const reserved={...S.reported}; const reservedDays=[]; const locked={}; const replace=[];
    relDates.filter(d=>idx[d].includes(p.id)).forEach(d=>{
      const x=X[d+'|'+p.id]; const submitted=x && x.status==='Submitted';
      if(d>=start){ if(hasActuals(d,p.id)) locked[d]=true; else { replace.push(d); return; } }
      if(!submitted){ const pl=P[d+'|'+p.id]; if(pl){ pl.lines.forEach(l=>{ reserved[l.key]=(reserved[l.key]||0)+l.qty; }); if(d<start) reservedDays.push(d); } }
    });
    const items=wipFor(p.id);
    const cf=S.cfOpen.filter(c=>c.processId===p.id && (c.status==='Open' || (c.status==='Planned' && replace.includes(c.plannedOn))));
    const q=E.buildQueue(items, cf, reserved);
    const pl=E.planNormal(p, q, start, nDays, S.cfg.holidays, d=>locked[d]?0:capFor(p.id,d));
    const days=pl.days.map(d=>({ date:d.date, capKg:d.capKg, usedKg:d.usedKg, locked:!!d.locked, lines:d.lines.map((l,i)=>lineFrom(l.item,l.qty,l.kg,l.group,l.cfIds,i+1)) }));
    days.forEach(d=>{ if(d.lines.length && d.date>endDate) endDate=d.date; });
    out[p.id]={ proc:p, days, remaining:pl.remaining, replace, reservedDays, wipKg:items.reduce((s,w)=>s+w.wt,0), plannableKg:q.reduce((s,e)=>s+e.qty*(e.item.unitWt||0),0) };
  }
  const hp=procs.find(p=>p.type==='HT');
  if(hp){
    if(endDate===start) endDate=E.addDays(start,Math.max(0,nDays-1));
    const wipBy={}; wipFor(hp.id).forEach(w=>wipBy[w.key]=w);
    const byDate={};
    S.ht.batches.filter(b=>b.status==='Planned'||b.status==='Running').forEach(b=>{ const d=localISO(new Date(b.plannedStart)); if(d<start||d>endDate) return;
      const o=byDate[d]=byDate[d]||{batches:[],lines:[]}; o.batches.push(b); b.items.forEach(x=>{ const w=wipBy[x.key]||{}; o.lines.push(lineFrom(w.key?w:x, x.qty, x.kg, x.group, x.cfIds, o.lines.length+1, b.id)); }); });
    const replace=relDates.filter(d=>d>=start && idx[d].includes(hp.id) && !hasActuals(d,hp.id));
    const locked={}; relDates.filter(d=>d>=start && idx[d].includes(hp.id) && hasActuals(d,hp.id)).forEach(d=>locked[d]=true);
    out[hp.id]={ proc:hp, ht:true, days:Object.keys(byDate).sort().map(d=>({date:d, capKg:null, locked:!!locked[d], lines:locked[d]?[]:byDate[d].lines, batches:byDate[d].batches})), replace };
  }
  return out;
}

function dayStatus(d, pids){
  const today=E.todayISO();
  const pub=pids.filter(p=>(S.planIdx[d]||[]).includes(p));
  if(!pub.length){
    const off=pids.every(p=>{ const pr=procById(p); return pr && pr.type!=='HT' && !E.isWorkDay(d,pr,S.cfg.holidays); });
    return off?{cls:'mute',txt:'Off day'}:{cls:'mute',txt:d>today?'Not planned yet':'No plan'};
  }
  let pq=0,aq=0,sub=0;
  pub.forEach(p=>{ const s=(S.sums[d]||{})[p]; if(!s) return; pq+=s.pq; aq+=s.aq; const pr=procById(p); if(s.submitted || (pr&&pr.type==='HT'&&d<today)) sub++; });
  if(sub===pub.length) return {cls:ragClass(pct(aq,pq)), txt:'Done · '+pctTxt(pct(aq,pq))};
  if(d<today) return {cls:'bad',txt:(pub.length>1?(pub.length-sub)+' of '+pub.length+' ':'')+'Actuals pending'};
  return {cls:'blue',txt:d===today?'Today · open':'Planned'};
}

async function publishPlan(start, prev){
  const btn=$('#pub'); btn.disabled=true; btn.textContent='Publishing…';
  try{
    const now=new Date().toISOString(); const written=[]; const removed=[]; const cfPlan={};
    for(const p of sortedProcs().filter(p=>p.active)){
      const pv=prev[p.id]; if(!pv) continue;
      const newDates=[];
      for(const d of pv.days){
        if(d.locked || !d.lines.length) continue;
        await Store.set('plan/'+d.date+'/'+p.id, {date:d.date, processId:p.id, processName:p.name, type:p.type, capKg:d.capKg, lines:d.lines, publishedAt:now, publishedBy:S.user.username, run:start});
        newDates.push(d.date); written.push([d.date,p.id]);
        d.lines.forEach(l=>(l.cfIds||[]).forEach(id=>{ if(!cfPlan[id]) cfPlan[id]=d.date; }));
      }
      for(const d of pv.replace) if(!newDates.includes(d)){ await Store.del('plan/'+d+'/'+p.id); removed.push([d,p.id]); }
    }
    const touched=new Set(written.concat(removed).map(x=>x[1]));
    await updateCF(list=>{ list.forEach(c=>{
      if(touched.has(c.processId) && c.status==='Planned' && c.plannedOn>=start && (prev[c.processId]||{}).replace && (prev[c.processId].replace.includes(c.plannedOn) || written.some(w=>w[0]===c.plannedOn&&w[1]===c.processId))){ c.status='Open'; delete c.plannedOn; }
      if(cfPlan[c.id] && c.status==='Open'){ c.status='Planned'; c.plannedOn=cfPlan[c.id]; } }); });
    await Store.update('planidx', d=>{ d=d||{dates:{}};
      removed.forEach(([dt,pid])=>{ d.dates[dt]=(d.dates[dt]||[]).filter(x=>x!==pid); if(!d.dates[dt].length) delete d.dates[dt]; });
      written.forEach(([dt,pid])=>{ d.dates[dt]=Array.from(new Set([...(d.dates[dt]||[]),pid])); }); return d; });
    for(const [dt,pid] of written) await recomputeSummary(dt,pid);
    for(const [dt,pid] of removed) await Store.update('sum/'+dt.slice(0,4), d=>{ if(d&&d.d[dt]) delete d.d[dt][pid]; return d||{d:{}}; }).then(()=>{ if(S.sums[dt]) delete S.sums[dt][pid]; });
    const days=[...new Set(written.map(w=>w[0]))].sort();
    await audit('Publish day-wise plan', 'From '+start+': '+days.length+' day(s) '+(days.length?days[0]+' → '+days[days.length-1]:'')+', '+written.length+' process-days'+(removed.length?', '+removed.length+' old process-days removed':''));
    S.planIdx=((await Store.get('planidx'))||{dates:{}}).dates; await loadPlannedKeys(); derive();
    toast('Day-wise plan published: '+days.length+' day(s), '+(days.length?fdate(days[0])+' to '+fdate(days[days.length-1]):'')+'.'); S.ui.planMode='published'; go('plan');
  }catch(e){ console.error(e); toast('Publishing failed: '+e.message,true); btn.disabled=false; }
}
async function recomputeSummary(date,pid){
  const [p,x]=await Store.getMany(['plan/'+date+'/'+pid,'exec/'+date+'/'+pid]);
  const s=E.summariseDay(p?p.lines:[], x?x.lines:[]); s.capKg=p?p.capKg:null; s.planned=!!p; s.submitted=!!(x&&x.status==='Submitted');
  await Store.update('sum/'+date.slice(0,4), d=>{ d=d||{d:{}}; d.d[date]=d.d[date]||{}; d.d[date][pid]=s; return d; });
  S.sums[date]=S.sums[date]||{}; S.sums[date][pid]=s;
}

/* ---------- WIP print: every WIP line grouped date-wise (plan date or stage start date) ---------- */
async function wipPlanDates(){
  const today=E.todayISO(); const idx=S.planIdx||{}; const map={};
  const pairs=[]; Object.keys(idx).filter(d=>d>=E.addDays(today,-14)).sort().forEach(d=>idx[d].forEach(pid=>{ if(!(S.sums[d]&&S.sums[d][pid]&&S.sums[d][pid].submitted)) pairs.push([d,pid]); }));
  const docs=await Store.getMany(pairs.map(([d,pid])=>'plan/'+d+'/'+pid));
  pairs.forEach(([d,pid],i)=>{ const doc=docs[i]; if(doc) doc.lines.forEach(l=>{ if(!map[l.key]||d<map[l.key]) map[l.key]=d; }); });
  S.ht.batches.forEach(b=>{ const d=localISO(new Date(b.plannedStart)); b.items.forEach(x=>{ if(!map[x.key]||d<map[x.key]) map[x.key]=d; }); });
  return map;
}

  if($('#esub')) $('#esub').onclick=async()=>{
    const {miss,need}=recalc();
    if(miss||need){ $('#emsg').innerHTML=`<span style="color:var(--bad)">Not submitted: ${miss?miss+' row(s) without actual qty':''}${miss&&need?' and ':''}${need?need+' shortfall row(s) without a reason':''}.</span>`; return; }
    const lines=collect().map(l=>({...l, actualQty:l.actualQty, shortQty:l.shortQty}));
    $('#esub').disabled=true;
    try{
      const cur=await Store.get('exec/'+date+'/'+pid); if(cur && cur.status==='Submitted'){ toast('Already submitted by '+cur.submittedBy+'.',true); return go('exec'); }
      await Store.set('exec/'+date+'/'+pid,{date,processId:pid,status:'Submitted',lines,submittedAt:new Date().toISOString(),submittedBy:S.user.username});
      await applyCarryForward(date,pid,lines);
      let moved=0;
      if(routingOn()){ const mv=await transferWip(date, pid, lines.filter(l=>l.actualQty>0).map(l=>({key:l.key, qty:l.actualQty})));
        moved=mv.reduce((s,x)=>s+x.qty,0); await Store.update('exec/'+date+'/'+pid, x=>{ x.moves=mv; return x; }); }
      await recomputeSummary(date,pid);
      await audit('Submit actuals', pid+' '+date+' – '+lines.length+' lines, shortfall '+lines.reduce((s,l)=>s+l.shortQty,0));
      if(routingOn()){ await reloadWip(); await writeSnapshot(E.todayISO()); } else { await loadReported(); derive(); }
      toast('Actuals submitted for '+fdate(date)+'.'+(moved?' '+moved+' pcs moved to the next stage.':'')); go('exec');
    }catch(e){ console.error(e); toast('Submit failed: '+e.message,true); $('#esub').disabled=false; }
  };
  if($('#ereopen')) $('#ereopen').onclick=()=>modal('Reopen actuals','<p>Reopening lets the department correct and resubmit. Carry-forward created by this submission is withdrawn until it is submitted again.</p><label class="field">Reason for correction<input id="rr" style="width:100%"></label>',[
    {label:'Reopen',cls:'danger',fn:async d=>{ const why=d.querySelector('#rr').value.trim(); if(!why){ d.querySelector('#rr').classList.add('invalid'); return false; }
      const cur=await Store.get('exec/'+date+'/'+pid); let rv=null;
      if(cur && cur.moves && cur.moves.length) rv=await reverseMoves(date, cur.moves);
      await Store.update('exec/'+date+'/'+pid, x=>{ x.status='Draft'; x.reopenedAt=new Date().toISOString(); x.reopenedBy=S.user.username; x.reopenReason=why; x.moves=[]; return x; });
      if(rv) toast(rv.back+' pcs returned to this stage'+(rv.missing?'; '+rv.missing+' pcs were already processed further and stay there':'')+'.', !!rv.missing);
      await updateCF(list=>{ list.forEach(c=>{ if(c.fromDate===date && c.processId===pid && c.status==='Open'){ c.status='Superseded'; c.closeNote='Withdrawn: actuals reopened'; } }); });
      await recomputeSummary(date,pid); await audit('Reopen actuals', pid+' '+date+' – '+why); if(routingOn()) await reloadWip(); else { await loadReported(); derive(); } go('exec'); }}]);
}
/* shortfall -> new carry-forward; carried lines that were completed -> closed. One open record per UID, so nothing is lost or doubled. */
async function applyCarryForward(date, pid, lines){
  const now=new Date().toISOString();
  await updateCF(list=>{
    lines.forEach(l=>{
      (l.cfIds||[]).forEach(id=>{ const c=list.find(x=>x.id===id); if(c && c.status!=='Closed'){ c.status=l.shortQty>0?'Superseded':'Closed'; c.closeNote=l.shortQty>0?'Short again on '+date:'Recovered on '+date; c.closedAt=now; } });
      if(l.shortQty>0){
        list.forEach(c=>{ if(c.key===l.key && (c.status==='Open'||c.status==='Planned')){ c.status='Superseded'; c.closeNote='Replaced by shortfall of '+date; c.closedAt=now; } });
        list.push({id:uidGen('CF'), fromDate:date, processId:pid, key:l.key, uid:l.uid, job:l.job, part:l.part, qty:l.shortQty, kg:l.shortKg, reason:l.reason, remarks:l.remarks,
          status:'Open', priority:'High', createdAt:now, createdBy:S.user.username, batchId:l.batchId||null});
      }
    });
  });
}

/* ---------- manual load builder ---------- */
function htCandidates(){
  const hp=htProc();
  const cf=S.cfOpen.filter(c=>c.processId===hp.id && (c.status==='Open'||c.status==='Planned'));
  const q=E.buildQueue(wipFor(hp.id), cf, S.reported);
  const by={}; const order=[];
  q.forEach(e=>{ const k=e.item.key; if(!by[k]){ by[k]={item:e.item, qty:0, group:e.group, cfIds:[]}; order.push(k); } by[k].qty+=e.qty; by[k].group=Math.min(by[k].group,e.group); by[k].cfIds.push(...(e.cfIds||[])); });
  const loaded={}; S.ht.batches.forEach(b=>b.items.forEach(x=>{ loaded[x.key]=b; }));
  return order.map(k=>{ const c=by[k]; const chain=E.recipeChain(c.item.met,S.cfg.recipes); const doneSeq=S.htProgress[k]||0;
    c.recipe=chain.find(r=>(r.sequence||1)>doneSeq)||null; c.noRecipe=!chain.length; c.loaded=loaded[k]||null; return c; });
}

const draftFor=met=>S.cfg.recipes.find(r=>r.status==='Draft' && String(r.metallurgies||'').split(',').some(p=>p.trim() && E.matchPattern(p.trim(),met)));
function recipeGapBanner(list){
  const blocked=list.filter(c=>!c.loaded && c.noRecipe); if(!blocked.length) return '';
  const drafts={}, none={};
  blocked.forEach(c=>{ const d=draftFor(c.item.met); const kg=c.qty*(c.item.unitWt||0);
    if(d){ const x=drafts[d.id]=drafts[d.id]||{r:d,n:0,kg:0}; x.n++; x.kg+=kg; } else { const m=c.item.met||'(blank)'; const x=none[m]=none[m]||{n:0,kg:0}; x.n++; x.kg+=kg; } });
  const admin=isRole('Admin');
  return `<div class="banner warn" style="margin-bottom:10px"><b>${blocked.length} line(s) cannot be loaded yet because their metallurgy has no active HT recipe.</b> A recipe gives the cycle time and load limit, so it must be approved before use.
    ${Object.values(drafts).map(x=>`<div class="row" style="margin-top:8px"><span>Draft recipe <b>${esc(x.r.name)}</b> (${esc(x.r.metallurgies)}, ${E.cycleHours(x.r)} h, max ${fmt(x.r.maxBatchKg)} kg) – ${x.n} lines, ${mt(x.kg)} MT waiting.</span>
      ${admin?`<button class="btn sm" data-approve="${esc(x.r.id)}">Approve and use this recipe</button>`:'<span class="small">Ask the administrator to approve it in Masters › HT recipes.</span>'}</div>`).join('')}
    ${Object.keys(none).length?`<div style="margin-top:8px">No recipe at all for: ${Object.entries(none).sort((a,b)=>b[1].kg-a[1].kg).map(([m,x])=>`<b>${esc(m)}</b> (${x.n} lines, ${mt(x.kg)} MT)`).join(', ')}. ${admin?'Add them in Masters › HT recipes.':'Ask the administrator to add them in Masters › HT recipes.'}</div>`:''}</div>`;
}

function furnaceFreeFrom(fid){
  const f=S.cfg.furnaces.find(x=>x.id===fid)||{}; let t=nextHourISO();
  if(f.availableFrom && f.availableFrom>t) t=f.availableFrom;
  S.ht.batches.filter(b=>b.furnaceId===fid).forEach(b=>{ const e=E.addHours(b.plannedEnd, +f.turnaroundH||0); if(e>t) t=e; });
  return t;
}

    ${list.length?list.map(c=>{ const k=c.item.key; const sel=U.htSel[k]!==undefined; const rc=c.loaded?`<span class="chip heat">In ${esc(c.loaded.furnaceId)} · ${fdt(c.loaded.plannedStart)}</span>`:c.recipe?`<span class="chip ok">${esc(c.recipe.name)} · ${E.cycleHours(c.recipe)} h</span>`:c.noRecipe?(draftFor(c.item.met)?'<span class="chip warn">Recipe in Draft</span>':'<span class="chip bad">No recipe</span>'):'<span class="chip mute">HT complete</span>';

function loadCheck(byKey){
  const U=S.ui; const keys=Object.keys(U.htSel); const fid=U.htFurn||(S.cfg.furnaces[0]||{}).id; const f=S.cfg.furnaces.find(x=>x.id===fid);
  const sel=keys.map(k=>({c:byKey[k], qty:U.htSel[k]})).filter(x=>x.c);
  const kg=sel.reduce((s,x)=>s+x.qty*(x.c.item.unitWt||0),0);
  const recs=[...new Set(sel.map(x=>x.c.recipe&&x.c.recipe.id))]; const recipe=recs.length===1?S.cfg.recipes.find(r=>r.id===recs[0]):null;
  const start=U.htLoadStart||furnaceFreeFrom(fid); const cyc=recipe?E.cycleHours(recipe):0; const end=recipe?E.addHours(start,cyc):null;
  const limit=recipe&&f?Math.min(+f.capacityKg||Infinity,+recipe.maxBatchKg||Infinity):(f?+f.capacityKg:0);
  const errs=[];
  if(!sel.length) errs.push('Select at least one line.');
  if(recs.length>1) errs.push('Batch incompatibility: the selected lines need different recipes ('+recs.map(id=>(S.cfg.recipes.find(r=>r.id===id)||{}).name).join(', ')+'). Load them separately.');
  if(!f) errs.push('Choose a furnace.');
  else{
    if(recipe && recipe.furnaces && recipe.furnaces.length && !recipe.furnaces.includes(f.id)) errs.push('Recipe '+recipe.name+' is not allowed in '+f.name+'.');
    if(f.status==='Out of service') errs.push(f.name+' is out of service.');
    else if(f.status!=='Available' && !(f.availableFrom && start>=f.availableFrom)) errs.push(f.name+' is under '+f.status.toLowerCase()+(f.availableFrom?' until '+fdt(f.availableFrom):'')+'.');
    if(kg>limit+1e-6) errs.push('Capacity unavailable: '+fmt(kg)+' kg is '+fmt(kg-limit)+' kg over the '+fmt(limit)+' kg limit.');
    if(end){ const clash=S.ht.batches.find(b=>b.furnaceId===f.id && start<b.plannedEnd && end>(b.actualStart||b.plannedStart));
      if(clash) errs.push('Furnace time clash with load '+clash.id+' ('+fdt(clash.actualStart||clash.plannedStart)+' – '+fdt(clash.plannedEnd)+').'); }
  }
  return {sel,kg,recipe,f,start,end,cyc,limit,errs};
}
function renderLoadBar(byKey){

async function createManualLoad(byKey){
  const L=loadCheck(byKey); if(L.errs.length) return toast(L.errs[0],true);
  const id='M'+localISO(new Date(L.start)).slice(2).replace(/-/g,'')+'-'+L.f.id+'-'+Date.now().toString(36).slice(-3).toUpperCase();
  const batch={ id, furnaceId:L.f.id, recipeId:L.recipe.id, recipeName:L.recipe.name, cycleH:L.cyc, plannedStart:L.start, plannedEnd:L.end, status:'Planned', source:'manual',
    createdBy:S.user.username, createdAt:new Date().toISOString(), kg:L.kg,

      qty:x.qty, kg:x.qty*(x.c.item.unitWt||0), unitWt:x.c.item.unitWt||0, group:x.c.group, cfIds:x.c.cfIds })) };
  try{
    S.ht=await Store.update('ht/active', d=>{ d=d||{batches:[]};
      const taken=new Set(); d.batches.forEach(b=>b.items.forEach(x=>taken.add(x.key)));
      const dup=batch.items.filter(x=>taken.has(x.key)); if(dup.length) throw new Error(dup.map(x=>x.uid).join(', ')+' was just loaded by another user.');
      const clash=d.batches.find(b=>b.furnaceId===batch.furnaceId && batch.plannedStart<b.plannedEnd && batch.plannedEnd>(b.actualStart||b.plannedStart));
      if(clash) throw new Error('Furnace time clash with load '+clash.id+'.');
      d.batches.push(batch); return d; });
    await audit('Create HT load', id+' on '+batch.furnaceId+' – '+batch.items.length+' lines, '+fmt(batch.kg)+' kg, start '+batch.plannedStart);

}

async function generateHT(startDT, horizonH){
  const hp=htProc(); S.ui.htStart=startDT;
  const items=wipFor(hp.id);
  const cf=S.cfOpen.filter(c=>c.processId===hp.id && (c.status==='Open'||c.status==='Planned'));
  const q=E.buildQueue(items, cf, S.reported);
  const fixed=S.ht.batches.filter(b=>b.status==='Running' || b.source!=='auto');      // own loads and running batches stay as they are
  const res=E.scheduleHT(q, S.cfg.recipes, S.cfg.furnaces, fixed, S.htProgress, startDT, horizonH);
  res.batches.forEach(b=>{ b.source='auto'; b.createdBy='auto-suggest'; });
  const unplanned=res.unplanned.map(u=>({key:u.e.item.key, uid:u.e.item.uid, job:u.e.item.job, met:u.e.item.met, qty:u.e.qty, kg:u.e.qty*(u.e.item.unitWt||0), reason:u.reason, detail:u.detail||''}));
  S.ht=await Store.update('ht/active', d=>({ batches:[...((d&&d.batches)||[]).filter(b=>b.status==='Running' || b.source!=='auto'), ...res.batches], unplanned, generatedAt:new Date().toISOString(), generatedBy:S.user.username, startDT, horizonH }));
  await audit('Auto-suggest HT loads', res.batches.length+' loads from '+startDT+', '+unplanned.length+' lines not scheduled');
  derive(); toast(res.batches.length+' loads suggested.'); go('ht');
}
