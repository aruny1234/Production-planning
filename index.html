/* which process gets planned, and why not – shown above the preview */
function planCoverage(prev, procs){
  const all=sortedProcs().filter(p=>!p.mergedInto && (!S.deptCtx || S.deptCtx.pids.includes(p.id)));
  const meta=S.wipMeta||{}, ps=meta.procSnap||{};
  const rows=all.map(p=>{ const pv=prev&&prev[p.id]; const w=S.wip.filter(x=>x.processId===p.id);
    const planned=pv? (pv.ht? pv.days.reduce((s,d)=>s+d.lines.length,0) : pv.days.reduce((s,d)=>s+d.lines.length,0)) : 0;
    const days=pv? pv.days.filter(d=>d.lines.length||(d.fixed||[]).length).length : 0;
    let why, cls='ok';
    if(!p.active){ why='Process is inactive – activate it in Masters › Processes'+(p.autoAdded?' (new process area found in Synchro)':''); cls='bad'; }
    else if(p.type==='HT'){ why='Heat Treatment is planned as furnace loads (Furnace loads / HT planning) – loads that start in this period are shown'; cls=planned?'ok':'warn'; }
    else if(!w.length){ why='No WIP in the app for this process – upload its Synchro WIP (Upload Synchro WIP (all) with the Master WIP sheet, or its department module)'; cls='bad'; }
    else if(pv && !pv.plannableKg){ why='All its WIP is already planned on earlier days, booked, or in an open carry-forward'; cls='warn'; }
    else if(!planned){ why='Nothing fits in the chosen days (check capacity in Masters › Processes)'; cls='warn'; }
    else why=`Planned: ${planned} line(s) over ${days} day(s)`+(pv.remaining&&pv.remaining.length?` · ${mt(pv.remaining.reduce((s,e)=>s+e.qty*(e.item.unitWt||0),0))} MT beyond the chosen days`:'');
    const snap=ps[p.id]; const up=snap?fdate(snap.date)+' ('+esc(snap.file||'')+')':(w.length&&meta.snapshotDate?fdate(meta.snapshotDate):'–');
    return `<tr class="${cls==='bad'?'rowbad':''}"><td><b>${esc(p.id+' '+p.name)}</b>${p.type==='HT'?' <span class="chip heat">HT</span>':''}</td><td>${p.active?'<span class="chip ok">active</span>':'<span class="chip bad">inactive</span>'}</td><td class="r num">${fmt(w.length)}</td><td class="r num">${mt(w.reduce((s,x)=>s+x.wt,0))}</td><td>${up}</td><td class="r num">${fmt(capFor(p.id,E.todayISO()),1)}</td><td><span class="chip ${cls}">${cls==='ok'?'OK':cls==='warn'?'Check':'Not planned'}</span> ${why}</td></tr>`; }).join('');
  return `<details class="panel" style="margin-bottom:12px" ${/rowbad/.test(rows)?'open':''}><summary style="cursor:pointer"><b>Which processes are planned?</b> <span class="small muted">WIP, capacity and the reason for every process</span></summary>
    <div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Process</th><th>Status</th><th class="r">WIP lines</th><th class="r">WIP MT</th><th>WIP snapshot</th><th class="r">Capacity MT/day</th><th>Planning</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
}

/* ---------- open planned lines (any plan day whose actuals are not submitted yet) ---------- */
async function openPlanLines(pids, back=45, fwd=30){
  const today=E.todayISO(), from=E.addDays(today,-back), to=E.addDays(today,fwd); const idx=S.planIdx||{};
  const pairs=[]; Object.keys(idx).filter(d=>d>=from && d<=to).sort().forEach(d=>idx[d].forEach(pid=>{ if(pids.includes(pid)) pairs.push([d,pid]); }));
  const docs=await Store.getMany(pairs.flatMap(([d,pid])=>['plan/'+d+'/'+pid,'exec/'+d+'/'+pid]));
  const out=[];
  pairs.forEach(([d,pid],i)=>{ const p=docs[2*i], x=docs[2*i+1]; if(!p || (x && x.status==='Submitted')) return;
    p.lines.forEach(l=>{ const b=bookedQty(l); const rem=l.qty-b; if(rem>0) out.push({pid, planDate:d, line:l, booked:b, remaining:rem, pub:(p.publishedAt||'').slice(0,10)}); }); });
  return out;
}
/* book actual quantities: exec line on the ACTUAL date, booking on the PLAN line, routing move, summaries for both days */
async function bookLines(entries, src, upId){
  if(!entries.length) return 0;
  const now=new Date().toISOString(); const touched=new Set();
  const grp=(f)=>{ const g={}; entries.forEach(e=>{ const k=f(e); if(k) (g[k]=g[k]||[]).push(e); }); return g; };
  for(const [k,list] of Object.entries(grp(e=>e.date+'|'+e.pid))){ const [date,pid]=k.split('|');
    await Store.update('exec/'+date+'/'+pid, d=>{ d=d||{date,processId:pid,status:'Open',lines:[]}; d.lines=d.lines||[];
      list.forEach(e=>{ const l=e.line, uw=+l.unitWt||0;
        d.lines.push({planLineId:l.id||null, planDate:e.planDate||null, offPlan:e.planDate!==date, source:src, key:l.key, uid:l.uid, job:l.job, part:l.part, die:toolOf(l), desc:descOf(l), met:l.met, cust:l.cust||'',
          plannedQty:e.planDate===date?e.qty:0, plannedKg:e.planDate===date?e.qty*uw:0, unitWt:uw, actualQty:e.qty, actualKg:e.qty*uw, shortQty:0, shortKg:0, reason:'', remarks:e.remarks||'', bookedBy:S.user.username, bookedAt:now, upId:upId||null}); });
      return d; });
    touched.add(date+'|'+pid); }
  const closeCF=[];
  for(const [k,list] of Object.entries(grp(e=>e.planDate?e.planDate+'|'+e.pid:null))){ const [pd,pid]=k.split('|');
    await Store.update('plan/'+pd+'/'+pid, d=>{ if(!d) return d; list.forEach(e=>{ const l=d.lines.find(x=>x.id===e.line.id); if(!l) return;
      (l.bookings=l.bookings||[]).push({date:e.date, qty:e.qty, kg:e.qty*(+l.unitWt||0), src, by:S.user.username, ts:now, upId:upId||null});
      if((l.cfIds||[]).length && bookedQty(l)>=l.qty) closeCF.push({date:e.date, pid, line:{key:l.key, shortQty:0, cfIds:l.cfIds}}); }); return d; });
    touched.add(pd+'|'+pid); }
  for(const c of closeCF) await applyCarryForward(c.date, c.pid, [c.line]);
  if(routingOn()) for(const [k,list] of Object.entries(grp(e=>e.date+'|'+e.pid))){ const [date,pid]=k.split('|'); await transferWip(date, pid, list.map(e=>({key:e.line.key, qty:e.qty}))); }
  for(const t of touched){ const [d,p]=t.split('|'); await recomputeSummary(d,p); }
  await audit('Book actuals ('+(src==='synchro'?'Synchro booking':'UID search')+')', entries.length+' line(s): '+entries.slice(0,20).map(e=>e.line.uid+'×'+e.qty+'@'+e.date).join(', '));
  if(routingOn()){ await reloadWip(); await writeSnapshot(E.todayISO()); } else { await loadReported(); derive(); }
  return entries.length;
}
async function execSearch(pid){
  const body=$('#ebody'); body.innerHTML='<div class="empty">Loading open planned castings…</div>';
  const cand=await openPlanLines([pid]);
  const q=(S.ui.exQ||'').trim().toLowerCase(); const actDate=S.ui.exDate||E.todayISO();
  const hits=cand.filter(c=>!q || [c.line.uid,c.line.job,toolOf(c.line),descOf(c.line),c.line.part].join(' ').toLowerCase().includes(q))
    .sort((a,b)=>a.planDate<b.planDate?-1:a.planDate>b.planDate?1:0);
  body.innerHTML=`<div class="panel" style="margin-bottom:12px"><div class="row" style="align-items:flex-end">
      <label class="field">Search UID, Job, Tooling no. or description<input id="exq" value="${esc(S.ui.exQ||'')}" placeholder="e.g. 26BLV/1 or J26/1057" style="width:300px" autofocus></label>

async function applyCarryForward(date, pid, lines){
  const now=new Date().toISOString();
  await updateCF(list=>{
    lines.forEach(l=>{
      (l.cfIds||[]).forEach(id=>{ const c=list.find(x=>x.id===id); if(c && c.status!=='Closed'){ c.status=l.shortQty>0?'Superseded':'Closed'; c.closeNote=l.shortQty>0?'Short again on '+date:'Recovered on '+date; c.closedAt=now; } });
      if(l.shortQty>0){
        list.forEach(c=>{ if(c.key===l.key && (c.status==='Open'||c.status==='Planned')){ c.status='Superseded'; c.closeNote='Replaced by shortfall of '+date; c.closedAt=now; } });
        list.push({id:uidGen('CF'), fromDate:date, processId:pid, key:l.key, uid:l.uid, job:l.job, part:l.part, qty:l.shortQty, kg:l.shortKg, reason:l.reason, remarks:l.remarks,
          status:'Open', priority:'High', createdAt:now, createdBy:S.user.username, batchId:l.batchId||null});
      }
    });
  });
}

function nextHourISO(){ const d=new Date(); d.setMinutes(0,0,0); d.setHours(d.getHours()+1); return d.toISOString(); }
const dtLocalVal=iso=>{ if(!iso) return ''; const d=new Date(iso); return localISO(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); };
async function loadDoneBatches(months=2){

}

/* ---------- manual load builder ---------- */
function htCandidates(){
  const hp=htProc();
  const cf=S.cfOpen.filter(c=>c.processId===hp.id && (c.status==='Open'||c.status==='Planned'));
  const q=E.buildQueue(wipFor(hp.id), cf, S.reported);
  const by={}; const order=[];
  q.forEach(e=>{ const k=e.item.key; if(!by[k]){ by[k]={item:e.item, qty:0, group:e.group, cfIds:[]}; order.push(k); } by[k].qty+=e.qty; by[k].group=Math.min(by[k].group,e.group); by[k].cfIds.push(...(e.cfIds||[])); });
  const loaded={}; S.ht.batches.forEach(b=>b.items.forEach(x=>{ loaded[x.key]=b; }));
  return order.map(k=>{ const c=by[k]; const chain=E.recipeChain(c.item.met,S.cfg.recipes); const doneSeq=S.htProgress[k]||0;
    c.recipe=chain.find(r=>(r.sequence||1)>doneSeq)||null; c.noRecipe=!chain.length; c.loaded=loaded[k]||null; return c; });
}

const draftFor=met=>S.cfg.recipes.find(r=>r.status==='Draft' && String(r.metallurgies||'').split(',').some(p=>p.trim() && E.matchPattern(p.trim(),met)));
function recipeGapBanner(list){
  const blocked=list.filter(c=>!c.loaded && c.noRecipe); if(!blocked.length) return '';
  const drafts={}, none={};
  blocked.forEach(c=>{ const d=draftFor(c.item.met); const kg=c.qty*(c.item.unitWt||0);
    if(d){ const x=drafts[d.id]=drafts[d.id]||{r:d,n:0,kg:0}; x.n++; x.kg+=kg; } else { const m=c.item.met||'(blank)'; const x=none[m]=none[m]||{n:0,kg:0}; x.n++; x.kg+=kg; } });
  const admin=isRole('Admin');
  return `<div class="banner warn" style="margin-bottom:10px"><b>${blocked.length} line(s) cannot be loaded yet because their metallurgy has no active HT recipe.</b> A recipe gives the cycle time and load limit, so it must be approved before use.
    ${Object.values(drafts).map(x=>`<div class="row" style="margin-top:8px"><span>Draft recipe <b>${esc(x.r.name)}</b> (${esc(x.r.metallurgies)}, ${E.cycleHours(x.r)} h, max ${fmt(x.r.maxBatchKg)} kg) – ${x.n} lines, ${mt(x.kg)} MT waiting.</span>
      ${admin?`<button class="btn sm" data-approve="${esc(x.r.id)}">Approve and use this recipe</button>`:'<span class="small">Ask the administrator to approve it in Masters › HT recipes.</span>'}</div>`).join('')}
    ${Object.keys(none).length?`<div style="margin-top:8px">No recipe at all for: ${Object.entries(none).sort((a,b)=>b[1].kg-a[1].kg).map(([m,x])=>`<b>${esc(m)}</b> (${x.n} lines, ${mt(x.kg)} MT)`).join(', ')}. ${admin?'Add them in Masters › HT recipes.':'Ask the administrator to add them in Masters › HT recipes.'}</div>`:''}</div>`;
}

    <p class="small muted">${esc(r.remarks||'')}</p><p>Approve only if these are the plant's confirmed values. You can edit them later in Masters › HT recipes.</p>`,

function furnaceFreeFrom(fid){
  const f=S.cfg.furnaces.find(x=>x.id===fid)||{}; let t=nextHourISO();
  if(f.availableFrom && f.availableFrom>t) t=f.availableFrom;
  S.ht.batches.filter(b=>b.furnaceId===fid).forEach(b=>{ const e=E.addHours(b.plannedEnd, +f.turnaroundH||0); if(e>t) t=e; });
  return t;
}

    ${list.length?list.map(c=>{ const k=c.item.key; const sel=U.htSel[k]!==undefined; const rc=c.loaded?`<span class="chip heat">In ${esc(c.loaded.furnaceId)} · ${fdt(c.loaded.plannedStart)}</span>`:c.recipe?`<span class="chip ok">${esc(c.recipe.name)} · ${E.cycleHours(c.recipe)} h</span>`:c.noRecipe?(draftFor(c.item.met)?'<span class="chip warn">Recipe in Draft</span>':'<span class="chip bad">No recipe</span>'):'<span class="chip mute">HT complete</span>';

function loadCheck(byKey){
  const U=S.ui; const keys=Object.keys(U.htSel); const fid=U.htFurn||(S.cfg.furnaces[0]||{}).id; const f=S.cfg.furnaces.find(x=>x.id===fid);
  const sel=keys.map(k=>({c:byKey[k], qty:U.htSel[k]})).filter(x=>x.c);
  const kg=sel.reduce((s,x)=>s+x.qty*(x.c.item.unitWt||0),0);
  const recs=[...new Set(sel.map(x=>x.c.recipe&&x.c.recipe.id))]; const recipe=recs.length===1?S.cfg.recipes.find(r=>r.id===recs[0]):null;
  const start=U.htLoadStart||furnaceFreeFrom(fid); const cyc=recipe?E.cycleHours(recipe):0; const end=recipe?E.addHours(start,cyc):null;
  const limit=recipe&&f?Math.min(+f.capacityKg||Infinity,+recipe.maxBatchKg||Infinity):(f?+f.capacityKg:0);
  const errs=[];
  if(!sel.length) errs.push('Select at least one line.');
  if(recs.length>1) errs.push('Batch incompatibility: the selected lines need different recipes ('+recs.map(id=>(S.cfg.recipes.find(r=>r.id===id)||{}).name).join(', ')+'). Load them separately.');
  if(!f) errs.push('Choose a furnace.');
  else{
    if(recipe && recipe.furnaces && recipe.furnaces.length && !recipe.furnaces.includes(f.id)) errs.push('Recipe '+recipe.name+' is not allowed in '+f.name+'.');
    if(f.status==='Out of service') errs.push(f.name+' is out of service.');
    else if(f.status!=='Available' && !(f.availableFrom && start>=f.availableFrom)) errs.push(f.name+' is under '+f.status.toLowerCase()+(f.availableFrom?' until '+fdt(f.availableFrom):'')+'.');
    if(kg>limit+1e-6) errs.push('Capacity unavailable: '+fmt(kg)+' kg is '+fmt(kg-limit)+' kg over the '+fmt(limit)+' kg limit.');
    if(end){ const clash=S.ht.batches.find(b=>b.furnaceId===f.id && start<b.plannedEnd && end>(b.actualStart||b.plannedStart));
      if(clash) errs.push('Furnace time clash with load '+clash.id+' ('+fdt(clash.actualStart||clash.plannedStart)+' – '+fdt(clash.plannedEnd)+').'); }
  }
  return {sel,kg,recipe,f,start,end,cyc,limit,errs};
}
function renderLoadBar(byKey){

    <div class="small muted" style="margin-top:6px">Load start defaults to when the furnace is next free. The load appears in the daily plan of its start date (${fdate(localISO(new Date(L.start)))}).</div></div>`;

async function createManualLoad(byKey){
  const L=loadCheck(byKey); if(L.errs.length) return toast(L.errs[0],true);
  const id='M'+localISO(new Date(L.start)).slice(2).replace(/-/g,'')+'-'+L.f.id+'-'+Date.now().toString(36).slice(-3).toUpperCase();
  const batch={ id, furnaceId:L.f.id, recipeId:L.recipe.id, recipeName:L.recipe.name, cycleH:L.cyc, plannedStart:L.start, plannedEnd:L.end, status:'Planned', source:'manual',
    createdBy:S.user.username, createdAt:new Date().toISOString(), kg:L.kg,
    items:L.sel.map(x=>({ key:x.c.item.key, uid:x.c.item.uid, job:x.c.item.job, part:x.c.item.part, die:x.c.item.die||'', desc:x.c.item.desc||'', met:x.c.item.met, cust:x.c.item.cust||'', start:x.c.item.start||null,
      qty:x.qty, kg:x.qty*(x.c.item.unitWt||0), unitWt:x.c.item.unitWt||0, group:x.c.group, cfIds:x.c.cfIds })) };
  try{
    S.ht=await Store.update('ht/active', d=>{ d=d||{batches:[]};
      const taken=new Set(); d.batches.forEach(b=>b.items.forEach(x=>taken.add(x.key)));
      const dup=batch.items.filter(x=>taken.has(x.key)); if(dup.length) throw new Error(dup.map(x=>x.uid).join(', ')+' was just loaded by another user.');
      const clash=d.batches.find(b=>b.furnaceId===batch.furnaceId && batch.plannedStart<b.plannedEnd && batch.plannedEnd>(b.actualStart||b.plannedStart));
      if(clash) throw new Error('Furnace time clash with load '+clash.id+'.');
      d.batches.push(batch); return d; });
    await audit('Create HT load', id+' on '+batch.furnaceId+' – '+batch.items.length+' lines, '+fmt(batch.kg)+' kg, start '+batch.plannedStart);
    S.ui.htSel={}; S.ui.htLoadStart=null; derive(); toast('Load '+id+' added to '+L.f.name+'.'); go('ht');
  }catch(e){ toast('Load not saved: '+e.message,true); }
}

function furnaceCard(f, edit){
  const run=S.ht.batches.find(b=>b.furnaceId===f.id && b.status==='Running');
  const next=S.ht.batches.filter(b=>b.furnaceId===f.id && b.status==='Planned').sort((a,b)=>a.plannedStart<b.plannedStart?-1:1)[0];
  const stc=f.status==='Available'?'ok':f.status==='Maintenance'?'warn':'bad';
  let prog='';
  if(run){ const st=run.actualStart||run.plannedStart; const el=E.hoursBetween(st,new Date().toISOString()); const p=Math.min(100,Math.max(0,100*el/run.cycleH));
    prog=`<div class="small" style="margin-top:8px"><b>Running:</b> ${esc(run.recipeName)} · ${mt(run.kg)} MT · ${fmt(el,1)} of ${run.cycleH} h</div><div class="bar"><i style="width:${p}%;background:${el>run.cycleH?'var(--bad)':'var(--heat)'}"></i></div>`; }
  return `<div class="panel" style="border-top:3px solid ${run?'var(--heat)':'var(--line)'}"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(f.name)} <span class="muted small">${esc(f.id)}</span></h3><span class="chip ${stc}">${esc(f.status)}</span></div>
    <div class="small muted">${fmt(f.capacityKg)} kg · ${esc(f.size||'')}${f.availableFrom?' · available from '+fdt(f.availableFrom):''}</div>${prog}
    <div class="small" style="margin-top:6px"><b>Next:</b> ${next?esc(next.recipeName)+' · '+mt(next.kg)+' MT · '+fdt(next.plannedStart):'none scheduled'}</div>
    ${edit?`<div class="row" style="margin-top:10px"><select data-fst="${f.id}">${['Available','Maintenance','Breakdown','Out of service'].map(s=>`<option ${s===f.status?'selected':''}>${s}</option>`).join('')}</select>

async function generateHT(startDT, horizonH){
  const hp=htProc(); S.ui.htStart=startDT;
  const items=wipFor(hp.id);
  const cf=S.cfOpen.filter(c=>c.processId===hp.id && (c.status==='Open'||c.status==='Planned'));
  const q=E.buildQueue(items, cf, S.reported);
  const fixed=S.ht.batches.filter(b=>b.status==='Running' || b.source!=='auto');      // own loads and running batches stay as they are
  const res=E.scheduleHT(q, S.cfg.recipes, S.cfg.furnaces, fixed, S.htProgress, startDT, horizonH);
  res.batches.forEach(b=>{ b.source='auto'; b.createdBy='auto-suggest'; });
  const unplanned=res.unplanned.map(u=>({key:u.e.item.key, uid:u.e.item.uid, job:u.e.item.job, met:u.e.item.met, qty:u.e.qty, kg:u.e.qty*(u.e.item.unitWt||0), reason:u.reason, detail:u.detail||''}));
  S.ht=await Store.update('ht/active', d=>({ batches:[...((d&&d.batches)||[]).filter(b=>b.status==='Running' || b.source!=='auto'), ...res.batches], unplanned, generatedAt:new Date().toISOString(), generatedBy:S.user.username, startDT, horizonH }));
  await audit('Auto-suggest HT loads', res.batches.length+' loads from '+startDT+', '+unplanned.length+' lines not scheduled');
  derive(); toast(res.batches.length+' loads suggested.'); go('ht');
}
async function batchAction(act, id){
  const b=S.ht.batches.find(x=>x.id===id); if(!b) return;
  const lines=`<div class="tbl-wrap"><table><thead><tr><th>UID</th><th>Job</th><th>Tooling no.</th><th>Description</th><th>Metallurgy</th><th>Priority</th><th class="r">Qty</th><th class="r">kg</th></tr></thead><tbody>${b.items.map(x=>`<tr><td>${esc(x.uid)}</td><td>${esc(x.job)}</td><td>${esc(toolOf(x))}</td><td class="wrap">${esc(descOf(x))}</td><td>${esc(x.met)}</td><td>${esc(E.GROUP_LABEL[x.group]||'')}</td><td class="r num">${x.qty}</td><td class="r num">${fmt(x.kg,1)}</td></tr>`).join('')}</tbody></table></div>`;
  if(act==='view') return modal('Batch '+b.id+' – '+b.recipeName, lines, []);
  if(act==='cancel') return modal('Unload '+b.id, '<p>The lines go back to the HT WIP list so they can be loaded again.</p>', [{label:'Unload',cls:'danger',fn:async()=>{
    S.ht=await Store.update('ht/active', d=>{ d.batches=d.batches.filter(x=>x.id!==id); return d; }); await audit('Unload HT load', id); derive(); go('ht'); }}]);
  if(act==='start'){
    if(S.ht.batches.some(x=>x.furnaceId===b.furnaceId && x.status==='Running')) return toast('Furnace '+b.furnaceId+' already has a running batch. Complete it first.',true);
    return modal('Start batch '+b.id, `<label class="field">Actual start<input type="datetime-local" id="bs" value="${dtLocalVal(new Date().toISOString())}"></label><div style="margin-top:10px">${lines}</div>`, [{label:'Start batch',cls:'heat',fn:async d=>{
      const st=new Date(d.querySelector('#bs').value).toISOString();
      S.ht=await Store.update('ht/active', x=>{ const y=x.batches.find(z=>z.id===id); y.status='Running'; y.actualStart=st; y.plannedEnd=E.addHours(st,y.cycleH); return x; });
      await audit('Start HT batch', id+' on '+b.furnaceId+' at '+st); derive(); go('ht'); }}]);
  }
  if(act==='complete'){
    const reasons=S.cfg.reasons;
    const body=`<div class="row"><label class="field">Actual end<input type="datetime-local" id="be" value="${dtLocalVal(new Date().toISOString())}"></label>
      <label class="field">Processing delay reason (if cycle overran)<select id="bpd"><option value="">–</option>${reasons.map(r=>`<option>${esc(r)}</option>`).join('')}</select></label></div>
      <div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>UID</th><th>Tooling no.</th><th>Description</th><th>Metallurgy</th><th class="r">Planned</th><th>Actual</th><th>Shortfall reason</th><th>Remarks</th></tr></thead><tbody>
      ${b.items.map((x,i)=>`<tr><td>${esc(x.uid)}</td><td>${esc(toolOf(x))}</td><td class="wrap">${esc(descOf(x))}</td><td>${esc(x.met)}</td><td class="r num">${x.qty}</td><td><input type="number" min="0" step="1" data-ba="${i}" value="${x.qty}"></td>
      <td><select data-br="${i}"><option value="">–</option>${reasons.map(r=>`<option>${esc(r)}</option>`).join('')}</select></td><td><input data-bm="${i}" style="width:150px"></td></tr>`).join('')}</tbody></table></div>`;
    return modal('Complete batch '+b.id+' – '+b.recipeName, body, [{label:'Save completion',cls:'heat',fn:async d=>{
      const end=new Date(d.querySelector('#be').value).toISOString(); const st=b.actualStart||b.plannedStart;
      const dur=E.hoursBetween(st,end); const pdr=d.querySelector('#bpd').value;
      if(dur>b.cycleH+0.5 && !pdr){ d.querySelector('#bpd').classList.add('invalid'); toast('The cycle ran '+fmt(dur-b.cycleH,1)+' h longer than standard. Choose a processing delay reason.',true); return false; }
      let bad=false; const hp=htProc(); const planDate=localISO(new Date(b.plannedStart));
      const ex=b.items.map((x,i)=>{ const a=Math.max(0,Math.round(+d.querySelector(`[data-ba="${i}"]`).value||0)); const sf=Math.max(0,x.qty-a); const r=d.querySelector(`[data-br="${i}"]`).value;
        if(sf>0 && !r){ d.querySelector(`[data-br="${i}"]`).classList.add('invalid'); bad=true; }
        return {planLineId:null, batchId:b.id, key:x.key, uid:x.uid, job:x.job, part:x.part, die:toolOf(x), desc:descOf(x), met:x.met, cust:x.cust||'', plannedQty:x.qty, plannedKg:x.kg, unitWt:x.unitWt,
          actualQty:a, actualKg:a*x.unitWt, shortQty:sf, shortKg:sf*x.unitWt, reason:sf>0?r:'', remarks:d.querySelector(`[data-bm="${i}"]`).value.trim(), cfIds:x.cfIds||[]}; });
      if(bad){ toast('Choose a shortfall reason for every short line.',true); return false; }
      const rec=S.cfg.recipes.find(r=>r.id===b.recipeId)||{sequence:1};
      const fin={...b, status:'Completed', actualStart:st, actualEnd:end, actualH:dur, actualKg:ex.reduce((s,x)=>s+x.actualKg,0), overrunH:Math.max(0,dur-b.cycleH), delayReason:pdr, completedBy:S.user.username};
      ex.forEach(x=>{ x.planDate=planDate; x.source='batch'; });
      await Store.update('exec/'+planDate+'/'+hp.id, x=>{ x=x||{date:planDate,processId:hp.id,status:'Batch',lines:[]}; x.lines.push(...ex); return x; });
      await Store.update('plan/'+planDate+'/'+hp.id, d=>{ if(!d) return d; const ts=new Date().toISOString(); ex.forEach(x=>{ if(!(x.actualQty>0)) return; const l=d.lines.find(y=>y.key===x.key && y.batchId===b.id) || d.lines.find(y=>y.key===x.key);
        if(l) (l.bookings=l.bookings||[]).push({date:planDate, qty:x.actualQty, kg:x.actualKg, src:'batch', by:S.user.username, ts}); }); return d; });
      await applyCarryForward(planDate, hp.id, ex);
      S.htProgress=await Store.update('ht/progress', p=>{ p=p||{}; ex.forEach(x=>{ if(x.shortQty===0) p[x.key]=Math.max(p[x.key]||0, rec.sequence||1); }); return p; });
      if(routingOn()){ const reqs=ex.filter(x=>x.actualQty>0 && !E.recipeChain(x.met,S.cfg.recipes).some(r=>(r.sequence||1)>(S.htProgress[x.key]||0))).map(x=>({key:x.key, qty:x.actualQty}));
        fin.moves=await transferWip(planDate, hp.id, reqs); }
      await Store.update('ht/done/'+end.slice(0,7), x=>{ x=x||{batches:[]}; x.batches.push(fin); return x; });
      S.ht=await Store.update('ht/active', x=>{ x.batches=x.batches.filter(z=>z.id!==id); return x; });
      await Store.update('planidx', x=>{ x=x||{dates:{}}; x.dates[planDate]=Array.from(new Set([...(x.dates[planDate]||[]),hp.id])); return x; });
      await recomputeSummary(planDate, hp.id);
      await audit('Complete HT batch', id+' – actual '+fmt(fin.actualKg)+' kg, '+fmt(dur,1)+' h'+(pdr?' (delay: '+pdr+')':''));
      if(routingOn()){ await reloadWip(); await writeSnapshot(E.todayISO()); } else { await loadReported(); derive(); } go('ht'); }}]);
  }
}
/* Gantt: one lane per furnace, coloured by batch state; red line = now */
function drawGantt(el, batches, startISO, hz){
  const t0=Math.min(new Date(startISO).getTime(), Date.now())-12*3600000; const t1=new Date(startISO).getTime()+hz*3600000;
  const pxh=6, L=110, W=L+(t1-t0)/3600000*pxh+20, laneH=58, top=30; const fs=S.cfg.furnaces; const H=top+fs.length*laneH+10;
  const x=t=>L+(t-t0)/3600000*pxh;
  let g=`<svg width="${W}" height="${H}" role="img" aria-label="Furnace schedule">`;
  const md=new Date(t0); md.setHours(24,0,0,0);
  for(let t=md.getTime(); t<t1; t+=86400000){ const xx=x(t);
    g+=`<line x1="${xx}" y1="${top-6}" x2="${xx}" y2="${H}" stroke="#D5DCE3"/><text x="${xx+4}" y="${top-12}" font-size="11" fill="#5A6977">${fdate(localISO(new Date(t)))}</text>`; }
  fs.forEach((f,i)=>{ const y=top+i*laneH; g+=`<rect x="0" y="${y}" width="${W}" height="${laneH}" fill="${i%2?'#FAFBFC':'#fff'}"/><text x="10" y="${y+24}" font-size="13" font-weight="600" fill="#16212C">${esc(f.name)}</text><text x="10" y="${y+40}" font-size="11" fill="#5A6977">${esc(f.status)}</text>`; });
  batches.forEach(b=>{ const i=fs.findIndex(f=>f.id===b.furnaceId); if(i<0) return;
    const s=new Date(b.actualStart||b.plannedStart).getTime(), e=new Date(b.actualEnd||b.plannedEnd).getTime(); if(e<t0||s>t1) return;
    const xs=Math.max(L,x(s)), xe=Math.min(W-20,x(e)), y=top+i*laneH+8;
    const fill=b.status==='Running'?'url(#heat)':b.status==='Completed'?'#B9C3CD':'#3E6283';
    const tip=`${b.id} · ${b.recipeName} · ${fmt(b.kg)} kg · ${b.items.length} lines · ${fdt(b.actualStart||b.plannedStart)} → ${fdt(b.actualEnd||b.plannedEnd)} · ${b.status}`;
    g+=`<g><title>${esc(tip)}</title><rect x="${xs}" y="${y}" width="${Math.max(3,xe-xs)}" height="${laneH-16}" rx="3" fill="${fill}"/>`+
       (xe-xs>60?`<text x="${xs+6}" y="${y+17}" font-size="11" fill="#fff">${esc(b.recipeName.slice(0,Math.floor((xe-xs)/6)))}</text><text x="${xs+6}" y="${y+32}" font-size="11" fill="#fff">${fmt(b.kg)} kg</text>`:'')+'</g>'; });
  const nx=x(Date.now()); g+=`<line x1="${nx}" y1="${top-6}" x2="${nx}" y2="${H}" stroke="#B8322A" stroke-width="2"/><text x="${nx+4}" y="${H-4}" font-size="10" fill="#B8322A">now</text>`;
  g+=`<defs><linearGradient id="heat" x1="0" x2="1"><stop offset="0" stop-color="#B84A00"/><stop offset=".6" stop-color="#E07A10"/><stop offset="1" stop-color="#F2A33A"/></linearGradient></defs></svg>`;
  el.innerHTML=g;
}

function rangeFor(kind, anchor){
  if(kind==='Day') return [anchor,anchor];
  if(kind==='Week'){ const s=E.weekStart(anchor); return [s,E.addDays(s,6)]; }
  if(kind==='Month'){ const s=anchor.slice(0,7)+'-01'; const n=new Date(Date.UTC(+anchor.slice(0,4),+anchor.slice(5,7),0)).getUTCDate(); return [s, anchor.slice(0,7)+'-'+pad(n)]; }
  if(kind==='Year') return [anchor.slice(0,4)+'-01-01', anchor.slice(0,4)+'-12-31'];
  return [S.ui.dFrom||anchor, S.ui.dTo||anchor];
}
/* Adherence counts only closed plan days (actuals submitted, or the day is over), so a plan still being worked on is not shown as 0 %. */
function agg(from,to,pid){
  const a={pq:0,pkg:0,aq:0,akg:0,sq:0,skg:0,offq:0,offkg:0,cap:0,capAkg:0,pqC:0,pkgC:0,aqC:0,akgC:0,pending:0,reasons:{}}; const today=E.todayISO();
  Object.entries(S.sums).forEach(([d,v])=>{ if(d<from||d>to) return; Object.entries(v).forEach(([p,s])=>{ if(pid && p!==pid) return;
    const tq=s.tq!==undefined?s.tq:s.aq, tkg=s.tkg!==undefined?s.tkg:s.akg;
    a.pq+=s.pq; a.pkg+=s.pkg; a.aq+=tq; a.akg+=tkg; a.sq+=s.sq; a.skg+=s.skg; a.offq+=s.offq||0; a.offkg+=s.offkg||0;
    const closed=s.submitted || d<today;
    if(closed){ a.pqC+=s.pq; a.pkgC+=s.pkg; a.aqC+=s.aq; a.akgC+=s.akg; if(s.capKg){ a.cap+=s.capKg; a.capAkg+=tkg; } } else if(s.pq>0) a.pending++;
    Object.entries(s.reasons||{}).forEach(([r,x])=>{ const t=a.reasons[r]=a.reasons[r]||{q:0,kg:0}; t.q+=x.q; t.kg+=x.kg; }); }); });
  a.adq=pct(a.aqC,a.pqC); a.adw=pct(a.akgC,a.pkgC); a.util=pct(a.capAkg,a.cap); return a;
}

/* ===================== DATA CHECK – duplicate UIDs in the WIP ===================== */
function wipDuplicates(){
  const byKey={}, byUID={};
  S.wip.forEach(w=>{ const u=normUID(w.uid); (byKey[w.processId+'|'+u]=byKey[w.processId+'|'+u]||[]).push(w); (byUID[u]=byUID[u]||new Set()).add(w.processId); });
  const sameStage=Object.values(byKey).filter(l=>l.length>1);
  const multiStage=Object.entries(byUID).filter(([u,s])=>s.size>1).map(([u,s])=>({uid:u, pids:[...s], lines:S.wip.filter(w=>normUID(w.uid)===u)}));
  return {sameStage, multiStage};
}

  const extra=D.sameStage.reduce((s,l)=>s+l.length-1,0);

      <div class="kpi"><div class="v num">${fmt(up.reduce((s,u)=>s+u.stat.dupInFile,0))}</div><div class="l">Duplicates excluded by uploads this year</div></div>

    <h2>Duplicates excluded by uploads</h2>

      ${up.map(u=>`<tr><td>${fdt(u.ts)}</td><td>${esc(u.by)}</td><td>${esc(u.mode)}${u.pids?' · '+esc(u.pids.join(', ')):''}</td><td class="r num">${u.stat.dupInFile}</td><td class="r num">${u.stat.skippedInWip||0}</td><td class="small" style="white-space:normal">${esc((u.stat.dupUIDs||[]).join(', '))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No duplicates excluded this year.</div>'}`;
  if($('#dcfix')) $('#dcfix').onclick=()=>modal('Remove duplicate lines',`<p>${extra} extra line(s) will be removed. For each UID the first line stays in WIP. Plans and history are not changed.</p>`,
    [{label:'Remove extra lines',cls:'danger',fn:async()=>{
      const pids=[...new Set(D.sameStage.map(l=>l[0].processId))]; let removed=0;

}

function editorTable(id, cols, rows){

function readEditor(id, cols, rows){
  const out=rows.map(r=>({...r})); const tbl=document.getElementById(id);
  tbl.querySelectorAll('[data-k]').forEach(el=>{ const r=out[+el.dataset.r]; const c=cols.find(x=>x.k===el.dataset.k); if(!c) return;
    if(c.t==='days'){ if(!r.__d){ r.__d=true; r[c.k]=[]; } if(el.checked) r[c.k].push(+el.dataset.day); return; }
    if(c.t==='chk') r[c.k]=el.checked; else if(c.t==='num') r[c.k]=el.value===''?'':+el.value; else if(c.t==='dt') r[c.k]=el.value?new Date(el.value).toISOString():''; else if(c.t==='pw'){ if(el.value) r.__pin=el.value; } else if(c.p) c.p(r,el.value); else r[c.k]=el.value.trim(); });
  out.forEach(r=>delete r.__d); return out;
}

  const render=(data)=>{ mb.innerHTML=(M.pre?M.pre():'')+`<p class="small muted">${esc(M.help)}</p>${hidden.length?`<div class="banner info">Synchro stage codes ${hidden.map(h=>esc(h.id)).join(', ')} (Subcontract) are read as ${[...new Set(hidden.map(h=>h.mergedInto))].map(esc).join(', ')} – one planning process; the castings carry a “Subcon” location tag.</div>`:''}${editorTable('mt',cols,data)}<div class="row" style="margin-top:10px"><button class="btn ghost" id="madd">Add row</button><button class="btn" id="msave">Save ${esc(tab.toLowerCase())}</button></div>`;
    mb.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const cur=readEditor('mt',cols,data); cur.splice(+b.dataset.del,1); render(cur); });
    $('#madd').onclick=()=>{ const cur=readEditor('mt',cols,data); cur.push(M.blank()); render(cur); };
    if(M.bind) M.bind();
    $('#msave').onclick=async()=>{ let cur=readEditor('mt',cols,data); const err=validateMaster(tab,cur); if(err) return toast(err,true);
      if(tab==='Users'){ try{ cur=await saveUsers(cur); }catch(e){ return toast(e.message,true); } }
      if(hidden.length) cur=cur.concat(hidden.filter(h=>!cur.some(x=>x.id===h.id)));
      await saveConfig(c=>{ c[M.key]=cur; }, tab+' ('+cur.length+' rows)');
      if(tab==='Users' && !S.cfg.users.some(u=>u.username===S.user.username)){ sessionStorage.removeItem('wipUser'); if(Store.mode==='firebase') await Store.auth.signOut(); return showLogin('Your own user was removed.'); }
      S.user=S.cfg.users.find(u=>u.username===S.user.username)||S.user; derive();
      if(tab==='Lead times' && S.wipMeta) await writeSnapshot(S.wipMeta.snapshotDate);   // refresh today's delayed-WIP point
      toast(tab+' saved.'); go(S.view==='dept'?'recipes':'masters'); }; };
  render(rows);
}
async function saveUsers(rows){
  if(Store.mode!=='firebase') return rows.map(u=>{ const x={...u}; if(x.__pin){ x.pin=pinHash(x.username,x.__pin); delete x.demo; } delete x.__pin; delete x.pinNew; return x; });
  const out=[];
  for(const u of rows){
    const x={...u}; x.username=normUser(x.username);
    if(!x.uid){ try{ x.uid=await fbCreateAccount(x.username, x.__pin); }
      catch(e){
        if(e.code!=='auth/email-already-in-use') throw new Error('Could not create '+x.username+': '+(e.code||e.message));
        try{ x.uid=await fbAdoptAccount(x.username, x.__pin); }       // left over from an earlier save: same password → reuse it
        catch(e2){ throw new Error('User name “'+x.username+'” already has a Firebase account with a different password. Type the password used last time, or delete '+x.username+'@prodplan.local in Firebase › Authentication › Users, or choose another user name.'); } } }
    else if(x.__pin && x.username===S.user.username){ throw new Error('To change your own password use the “Change password” button at the bottom-left (it asks for your current password first).'); }
    delete x.__pin; delete x.pinNew; delete x.pin; delete x.demo; out.push(x);
  }
  const uids={}; out.forEach(u=>{ uids[u.uid]=u.role; });
  await setAccess(uids);                     // removed users lose access immediately
  await audit('Users', out.length+' users; access list updated');
  return out;
}
function validateMaster(tab, rows){
  if(tab==='LT exceptions'){ if(rows.some(r=>!r.metallurgy && !r.part)) return 'An exception needs a Metallurgy or a Part (stage-wide values go in the stage table above).'; if(rows.some(r=>r.value===''||+r.value<=0)) return 'Every exception needs a lead time greater than zero.'; return null; }
  if(tab==='Processes'){ const ids=rows.map(r=>r.id); if(ids.some(x=>!x)) return 'Every process needs a Process ID.'; if(new Set(ids).size!==ids.length) return 'Process IDs must be unique.'; if(rows.filter(r=>r.type==='HT'&&r.active).length>1) return 'Only one active process can be of type HT.'; }
  if(tab==='Lead times'){ if(rows.some(r=>r.value===''||+r.value<=0)) return 'Every lead time needs a value greater than zero.'; }
  if(tab==='HT recipes'){ if(rows.some(r=>!r.id||!r.metallurgies)) return 'Every recipe needs an ID and at least one metallurgy.'; if(rows.some(r=>r.status==='Active' && !(E.cycleHours(r)>0))) return 'An active recipe needs a cycle time (stages with hours).'; if(new Set(rows.map(r=>r.id)).size!==rows.length) return 'Recipe IDs must be unique.'; }
  if(tab==='Routing'){ const ids=new Set(S.cfg.processes.map(p=>p.id));
    for(const r of rows){ const st=routeSteps(r); if(!r.name) return 'Every routing rule needs a name.'; if(st.length<1) return 'Rule '+r.name+' has no stages.';
      const bad=st.filter(x=>!ids.has(x)); if(bad.length) return 'Rule '+r.name+': unknown process ID '+bad.join(', ')+'.'; if(new Set(st).size!==st.length) return 'Rule '+r.name+' lists a stage twice.'; } }
  if(tab==='Furnaces'){ if(rows.some(r=>!r.id||!(+r.capacityKg>0))) return 'Every furnace needs an ID and a capacity.'; }
  if(tab==='Users'){ rows.forEach(r=>{ r.username=normUser(r.username); });
    const key=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]/g,'');
    for(const r of rows){ const out=[];
      for(const t of (r.processes||[])){ if(/^all$/i.test(t)) continue;
        const p=S.cfg.processes.find(x=>x.id===t) || S.cfg.processes.find(x=>key(x.name)===key(t)) || S.cfg.processes.find(x=>key(x.name).includes(key(t)) || key(x.id+x.name).includes(key(t)));
        if(!p) return 'User '+(r.name||r.username)+': process “'+t+'” not found. Use the process ID, e.g. 1060 for Knock Out, 1090,1095 for 1st Fettling.';
        if(!out.includes(p.id)) out.push(p.id); }
      r.processes=out;
      if((r.role==='Department User'||r.role==='HT User') && !out.length) return 'User '+(r.name||r.username)+' needs at least one process (e.g. 1060).'; }
    const un=rows.map(r=>r.username); if(un.some(x=>!x)) return 'Every user needs a user name.'; if(new Set(un).size!==un.length) return 'User names must be unique.';
    if(!rows.some(r=>r.role==='Admin')) return 'Keep at least one Admin.';
    if(rows.some(r=>!/^[a-z0-9._-]{2,30}$/i.test(r.username))) return 'User names may use letters, digits, dot, dash and underscore only (no spaces).';
    if(Store.mode==='firebase'){ if(rows.some(r=>!r.uid && !(r.__pin && r.__pin.length>=6))) return 'Set a password of at least 6 characters for every new user.';
      if(rows.some(r=>r.uid && r.__pin && r.username!==S.user.username)) return 'Passwords of other users cannot be changed here. Delete that user\'s row, save, then add the person again with a new user name and password.'; }
    else if(rows.some(r=>!r.pin && !r.__pin)) return 'Set a PIN for every new user.'; }
  return null;
}

        vals.forEach(x=>{ if(x.v==='') return; const o=old.find(l=>l.processId===x.pid)||{};

    $('#rmsave').onclick=async()=>{ const md=$('#rmode').value, en=$('#rent').value.trim()||'1060';

    const defaults=new Set(['Knock out','RR cutting & S/G','Heat treatment','1st fettling','Rough machining','Finish fettling',...S.cfg.processes.map(p=>p.name)]);
    mb.querySelectorAll('select[data-of="pid"]').forEach(sel=>sel.onchange=()=>{ const q=`[data-ri="${sel.dataset.ri}"][data-oi="${sel.dataset.oi}"]`;
      const d=mb.querySelector(q+'[data-of="desc"]'); if(!d.value || defaults.has(d.value)) d.value=procName(sel.value);
    });
    const act=(sel,fn)=>mb.querySelectorAll(sel).forEach(b=>b.onclick=()=>{ read(); fn(b); render(); });
    act('[data-addo]',b=>{ const r=data[+b.dataset.addo]; const last=r.ops.reduce((m,o)=>Math.max(m,+o.op||0),0); r.ops.push({op:last+10,pid:'',desc:'',type:'In-house',lt:''}); });
    act('[data-delo]',b=>{ const [ri,oi]=b.dataset.delo.split(':').map(Number); data[ri].ops.splice(oi,1); });
    const swap=(ri,a,b2)=>{ const o=data[ri].ops; if(b2<0||b2>=o.length) return; const t=o[a].pid, d=o[a].desc, ty=o[a].type, l=o[a].lt; Object.assign(o[a],{pid:o[b2].pid,desc:o[b2].desc,type:o[b2].type,lt:o[b2].lt}); Object.assign(o[b2],{pid:t,desc:d,type:ty,lt:l}); };
    act('[data-up]',b=>{ const [ri,oi]=b.dataset.up.split(':').map(Number); swap(ri,oi,oi-1); });
    act('[data-dn]',b=>{ const [ri,oi]=b.dataset.dn.split(':').map(Number); swap(ri,oi,oi+1); });
    act('[data-delr]',b=>{ data.splice(+b.dataset.delr,1); });
    act('[data-copy]',b=>{ const c=JSON.parse(JSON.stringify(data[+b.dataset.copy])); c.id=uidGen('RT'); c.name=(c.name||'Route')+' (copy)'; c.part=c.part||''; data.push(c); });
    $('#raddr').onclick=()=>{ read(); data.push({id:uidGen('RT'),name:'',part:'',metallurgy:'',customer:'',active:true,remarks:'',ops:[{op:10,pid:'1060',desc:'Knock out',type:'In-house',lt:''}]}); render(); };
    $('#rsave').onclick=async()=>{ read();
      data.forEach(r=>{ r.ops.forEach(o=>{ if(!o.desc && o.pid) o.desc=procName(o.pid); }); r.ops.sort((a,b)=>(+a.op||0)-(+b.op||0)); r.steps=routeSteps(r).join(' > '); });
      const ids=new Set(S.cfg.processes.map(p=>p.id));
      for(const r of data){ if(!r.name) return toast('Every route needs a name.',true); if(!r.ops.length) return toast('Route '+r.name+' has no operations.',true);
        if(r.ops.some(o=>!o.pid||!ids.has(o.pid))) return toast('Route '+r.name+': choose a process area for every operation.',true);
        if(r.ops.some(o=>!(+o.op>0))) return toast('Route '+r.name+': every operation needs an Op no. (10, 20, 30 …).',true);
        if(new Set(r.ops.map(o=>+o.op)).size!==r.ops.length) return toast('Route '+r.name+': operation numbers must be unique.',true);
        if(new Set(r.ops.map(o=>o.pid)).size!==r.ops.length) return toast('Route '+r.name+' uses the same process area twice.',true);
        if(r.ops.some(o=>o.lt!=='' && !(+o.lt>0))) return toast('Route '+r.name+': operation lead time must be greater than zero.',true); }
      if(!data.some(r=>r.active!==false && !r.part && !r.metallurgy && !r.customer)) toast('Note: no general route (all filters blank) – castings that match no route will not move.',true);
      await saveConfig(c=>{ c.routes=data; }, 'Routing ('+data.length+' routes): '+data.map(r=>r.name+' = '+r.steps).join(' | '));
      derive(); toast('Routing saved.'); go('masters'); };
  };
  render();
}

      <div class="grid g3" style="gap:4px;margin-top:4px">${deptList().map(dd=>`<label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-ud="${dd.id}" ${dd.processes.length && dd.processes.every(p=>(u.processes||[]).includes(p))?'checked':''}> <b>${esc(dd.name)}</b> <span class="muted">${esc(dd.processes.join(', '))}</span></label>`).join('')}</div></div>
    <div id="un_pbox" style="margin-top:10px"><div class="field">Processes * <span class="small muted">(filled from the department – untick a process to limit the person)</span></div>
      <div class="grid g3" style="gap:4px;margin-top:4px">${procs.map(p=>`<label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-up="${p.id}" ${(u.processes||[]).includes(p.id)?'checked':''}> <b>${esc(p.id)}</b> ${esc(p.name)}${p.type==='HT'?' <span class="chip heat">HT</span>':''}</label>`).join('')}</div></div>
    ${isNew?`<div class="grid g2" style="margin-top:10px">

      <label class="field">Repeat ${fb?'password':'PIN'} *<input type="password" id="un_pw2" autocomplete="new-password"></label></div>
      <label class="small"><input type="checkbox" id="un_show"> Show ${fb?'password':'PIN'}</label>`:''}
    <div id="un_msg" class="small" style="color:var(--bad);margin-top:10px;font-weight:600"></div>`,
    [{label:isNew?'Create user':'Save changes', cls:'heat', fn:async dd=>{
      const msg=t=>{ dd.querySelector('#un_msg').textContent=t; return false; };
      const name=dd.querySelector('#un_name').value.trim(); const role=dd.querySelector('#un_role').value;
      const username=isNew?normUser(dd.querySelector('#un_user').value):u.username;
      const processes=[...dd.querySelectorAll('[data-up]:checked')].map(x=>x.dataset.up);
      if(!name) return msg('Type the full name.');
      if(isNew){
        if(!/^[a-z0-9._-]{3,30}$/.test(username)) return msg('User name: 3–30 small letters or digits (dot, dash allowed), no spaces.');
        if(S.cfg.users.some(x=>x.username===username)) return msg('User name “'+username+'” is already used – choose another.');
      }
      if((role==='Department User'||role==='HT User') && !processes.length) return msg('Tick at least one process for this role.');
      if(!me && role!=='Admin' && u.role==='Admin' && S.cfg.users.filter(x=>x.role==='Admin').length<2) return msg('Keep at least one Admin.');
      let pw='';
      if(isNew){ pw=dd.querySelector('#un_pw').value; const pw2=dd.querySelector('#un_pw2').value;

              catch(e2){ btn.disabled=false; btn.textContent='Create user'; return msg('“'+username+'” already has a login in Firebase with another password (left from an earlier try). Use the same password as last time, or delete '+username+'@prodplan.local in Firebase › Authentication › Users, or choose another user name.'); } } }

  d.querySelectorAll('[data-ud]').forEach(cb=>cb.onchange=()=>{ const dd=deptById(cb.dataset.ud); dd.processes.forEach(pid=>{ const x=d.querySelector(`[data-up="${pid}"]`); if(x) x.checked=cb.checked; }); });
  if(isNew){ const nm=d.querySelector('#un_name'), us=d.querySelector('#un_user'); let touched=false;
    us.oninput=()=>{ touched=true; }; nm.oninput=()=>{ if(!touched) us.value=normUser(nm.value.split(' ')[0]||''); };

      ${procs.filter(p=>p.active && !used[p.id]).length?`<div class="banner warn">Not in any department: ${procs.filter(p=>p.active && !used[p.id]).map(p=>esc(p.id+' '+p.name)).join(', ')}</div>`:''}
      <div class="row"><button class="btn ghost" id="dadd">+ Add department</button><button class="btn heat" id="dsave">Save departments</button></div>`;
    mb.querySelectorAll('[data-dn]').forEach(x=>x.oninput=()=>{ ds[+x.dataset.dn].name=x.value; });
    mb.querySelectorAll('[data-dp]').forEach(x=>x.onchange=()=>{ const [i,pid]=x.dataset.dp.split('|'); const d=ds[+i]; d.processes=x.checked?[...new Set([...d.processes,pid])]:d.processes.filter(p=>p!==pid); draw(); });

      toast('Departments saved.'); go('masters'); };
  };
  draw();

/* ===================== HOLIDAYS – month calendar ===================== */
function vHolidays(mb){
  const ym=S.ui.holYM||E.todayISO().slice(0,7); S.ui.holYM=ym;
  const y=+ym.slice(0,4), mo=+ym.slice(5,7); const first=ym+'-01'; const nDays=new Date(Date.UTC(y,mo,0)).getUTCDate();
  const hol=S.cfg.holidays||[]; const hOf=d=>hol.find(h=>h.date===d);
  const std={workDays:[1,2,3,4,5,6]};                        // plant week: Monday–Saturday, Sunday off
  const days=[...Array(nDays).keys()].map(i=>ym+'-'+String(i+1).padStart(2,'0'));
  const sundays=days.filter(d=>E.weekdayISO(d)===0).length, hols=days.filter(d=>E.weekdayISO(d)!==0 && hOf(d)).length, wd=nDays-sundays-hols;
  const lead=(E.weekdayISO(first)+6)%7;                       // Monday first
  const procs=sortedProcs().filter(p=>p.active && !p.mergedInto && p.type!=='HT');
  const prevM=E.addDays(first,-1).slice(0,7), nextM=E.addDays(ym+'-'+String(nDays).padStart(2,'0'),1).slice(0,7);
  const title=new Date(Date.UTC(y,mo-1,1)).toLocaleString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'});
  mb.innerHTML=`<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="row"><button class="btn ghost sm" id="hprev" aria-label="Previous month">‹</button><h2 style="margin:0;min-width:170px;text-align:center">${esc(title)}</h2><button class="btn ghost sm" id="hnext" aria-label="Next month">›</button><button class="btn ghost sm" id="htoday">This month</button></div>
      <div class="kpi" style="padding:6px 14px"><div class="v num">${wd}</div><div class="l">working days = ${nDays} days − ${sundays} Sundays − ${hols} holiday(s)</div></div></div>
    <p class="small muted">Click a day to mark it as a <b>holiday</b>; click a holiday again to make it a working day. Sundays are weekly off. Holidays are skipped when planning and in the monthly target (working days × MT/day).</p>
    <div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>`<div class="calh">${w}</div>`).join('')}${'<div></div>'.repeat(lead)}
      ${days.map(d=>{ const wd_=E.weekdayISO(d), h=hOf(d), today=d===E.todayISO();
        const cls=wd_===0?'off':h?'hol':'work';
        return `<button class="cald ${cls} ${today?'today':''}" data-hd="${d}" ${wd_===0?'disabled':''} aria-label="${fday(d)}${h?' – holiday '+esc(h.name||''):''}"><b>${+d.slice(8)}</b><span>${wd_===0?'Sunday':h?esc(h.name||'Holiday'):''}</span></button>`; }).join('')}</div>
    <h2>Monthly target per process – ${esc(title)}</h2>
    <div class="tbl-wrap"><table><thead><tr><th>Process</th><th class="r">Capacity MT/day</th><th class="r">Working days</th><th class="r">Month target MT</th></tr></thead><tbody>
      ${procs.map(p=>{ const w=days.filter(d=>E.isWorkDay(d,p,S.cfg.holidays)); const t=w.reduce((s,d)=>s+capFor(p.id,d),0);
        return `<tr><td>${esc(p.id+' '+p.name)}</td><td class="r num">${fmt(capFor(p.id,first),1)}</td><td class="r num">${w.length}</td><td class="r num"><b>${fmt(t,2)}</b></td></tr>`; }).join('')}</tbody></table></div>
    <p class="small muted">Capacity MT/day comes from Masters › Processes (day-wise changes can be made on the plan screen). A process with its own work days (e.g. not on Saturday) is counted with its own days.</p>
    <h2>All holidays</h2>
    ${hol.length?`<div class="tbl-wrap" style="max-height:260px"><table><thead><tr><th>Date</th><th>Holiday</th><th></th></tr></thead><tbody>${hol.slice().sort((a,b)=>a.date<b.date?-1:1).map(h=>`<tr><td>${fday(h.date)}</td><td>${esc(h.name||'')}</td><td><button class="btn ghost sm" data-hgo="${h.date.slice(0,7)}">Show month</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No holidays marked yet.</div>'}`;
  const nav=v=>{ S.ui.holYM=v; vHolidays(mb); };
  $('#hprev').onclick=()=>nav(prevM); $('#hnext').onclick=()=>nav(nextM); $('#htoday').onclick=()=>nav(E.todayISO().slice(0,7));
  mb.querySelectorAll('[data-hgo]').forEach(b=>b.onclick=()=>nav(b.dataset.hgo));
  mb.querySelectorAll('[data-hd]').forEach(b=>b.onclick=()=>{ const d=b.dataset.hd; const h=hOf(d);
    if(h) return saveConfig(c=>{ c.holidays=(c.holidays||[]).filter(x=>x.date!==d); }, 'Holiday removed: '+d).then(()=>{ derive(); toast(fday(d)+' is a working day again.'); vHolidays(mb); });
    const dlg=modal('Mark holiday – '+fday(d), `<label class="field">Holiday name<input id="hname" placeholder="e.g. Diwali" style="width:100%"></label>`,

/* ===================== PLANT REVIEW DASHBOARD ===================== */
/* Used twice: Admin / Management = whole plant grouped by department; department module = its own processes.
   Sections: headline cards with change vs previous period, department/process summary, tonnage graphs,
   customer analysis, delivery risk against the customer agreed date, WIP ageing, shortfall Pareto, key insights. */
const PAL=['#2C4760','#D9730D','#2D7A4C','#8E44AD','#B8322A','#16A085','#C29B00','#2980B9','#6D4C41','#7F8C8D'];
const RISK_C={Missed:'#7A1C16','Will miss':'#B8322A','At risk':'#C28100','On time':'#2D7A4C','No agreed date':'#8A96A3'};

function addWorkDays(d, n){ let x=d; let k=Math.ceil(n);
  while(k>0){ x=E.addDays(x,1); const wd=E.weekdayISO(x); if(wd!==0 && !(S.cfg.holidays||[]).some(h=>(h.date||h)===x)) k--; } return x; }
function baseName(pid){ return String(procName(pid)||'').replace(/\s*\(.*\)\s*$/,'').trim().toLowerCase(); }
/* projected completion of the last route stage for one WIP line, compared with the customer agreed date */
function deliveryRisk(w, today){
  const defLT=+S.cfg.settings.defaultLTDays||2; const tight=+S.cfg.settings.riskDays||3;
  const ltDays=pid=>{ const l=E.leadTimeFor({...w, processId:pid}, S.cfg.leadTimes, today); return l?l.days:defLT; };
  const r=routeFor(w); let steps=r?routeSteps(r):[]; let i=steps.indexOf(w.processId);
  if(i<0){ const b=baseName(w.processId); i=steps.findIndex(pid=>baseName(pid)===b); }
  const rest=i>=0?steps.slice(i+1):[];
  let cur=(S.planDateOf&&S.planDateOf[w.key]) || null;
  if(!cur){ const t=w.delay&&w.delay.target; cur=t&&t>today?t:addWorkDays(today, w.delay&&w.delay.status==='Delayed'?1:ltDays(w.processId)); }
  let fin=cur; rest.forEach(pid=>{ fin=addWorkDays(fin, ltDays(pid)); });
  const ag=w.agreed||null; let status, margin=null;
  if(!ag) status='No agreed date';
  else { margin=Math.round((Date.parse(ag)-Date.parse(fin))/864e5);
    status= ag<today?'Missed' : margin<0?'Will miss' : margin<=tight?'At risk' : 'On time'; }
  return {fin, ag, margin, status, rest};
}
async function execLinesInRange(from,to,pids){
  const pairs=[]; Object.entries(S.sums||{}).forEach(([d,o])=>{ if(d<from||d>to) return; Object.keys(o).forEach(pid=>{ if(pids.includes(pid) && (o[pid].tq||o[pid].aq)) pairs.push([d,pid]); }); });
  const ck=from+'|'+to+'|'+pids.join(',')+'|'+(S.loadedAt||0);
  if(S.execCache && S.execCache.k===ck) return S.execCache.v;
  const docs=await Store.getMany(pairs.map(([d,pid])=>'exec/'+d+'/'+pid));
  const v=[]; docs.forEach((x,i)=>{ if(x) (x.lines||[]).forEach(l=>{ if(+l.actualQty>0) v.push({...l, date:pairs[i][0], pid:pairs[i][1]}); }); });
  S.execCache={k:ck, v}; return v;
}
function prevRange(from,to){ const n=Math.round((Date.parse(to)-Date.parse(from))/864e5)+1; return [E.addDays(from,-n), E.addDays(from,-1)]; }
const delta=(cur,prev,unit,goodUp=true)=>{ if(cur===null||prev===null||isNaN(cur)||isNaN(prev)) return ''; const d=cur-prev; if(Math.abs(d)<0.05) return '<span class="dlt">= prev.</span>';
  const good=goodUp? d>0 : d<0; return `<span class="dlt ${good?'up':'down'}">${d>0?'▲':'▼'} ${Math.abs(d).toFixed(unit==='%'?1:2)}${unit} vs prev.</span>`; };

async function plantDash(m, o){

  const aggP=(f,t,ps)=>{ const a={pq:0,pkg:0,aq:0,akg:0,sq:0,skg:0,offkg:0,cap:0,capAkg:0,pqC:0,pkgC:0,aqC:0,akgC:0,pending:0,reasons:{}};

    a.adq=pct(a.aqC,a.pqC); a.adw=pct(a.akgC,a.pkgC); a.book=a.pkg?100*a.akg/a.pkg:null;

    if(w.agreed && (!r.first||w.agreed<r.first)) r.first=w.agreed; });

  const meta=S.wipMeta||{}; const ps=meta.procSnap||{};

  const ups=(await Store.getMany(yrs.map(y=>'uploads/'+y))).flatMap(d=>(d&&d.list)||[]);
  const bk=ups.filter(u=>/booking/i.test(u.mode||'') && (!u.pids||u.pids.some(p=>pids.includes(p))) && u.ts.slice(0,10)>=E.addDays(from,-7));
  const planDays=Object.entries(S.planIdx||{}).filter(([d,p])=>d>=from&&d<=to&&p.some(x=>pids.includes(x))).length;
  const wipRows=pids.map(pid=>{ const x=ps[pid]; return `<tr><td>${esc(pid+' '+procName(pid))}</td><td>${x?esc(x.file||''):esc(meta.file||'–')}</td><td>${x?fdate(x.date):fdate(meta.snapshotDate)}</td><td>${x&&x.at?fdt(x.at):meta.uploadedAt?fdt(meta.uploadedAt):'–'}</td><td>${esc(x?x.by:'')}</td><td class="r num">${fmt(S.wip.filter(w=>w.processId===pid).length)}</td></tr>`; }).join('');
  return `<details class="panel" style="margin-top:12px"><summary style="cursor:pointer"><b>Where do these numbers come from?</b> <span class="small muted">Only your own uploads and entries – there is no sample data. ${fmt(S.wip.filter(w=>pids.includes(w.processId)).length)} WIP lines · ${bk.length} booking upload(s) · ${planDays} plan day(s) in the period.</span></summary>
    <div class="grid g2" style="margin-top:10px"><div><h3>WIP (Upload Synchro WIP)</h3><div class="tbl-wrap"><table><thead><tr><th>Process</th><th>File</th><th>Snapshot</th><th>Uploaded</th><th>By</th><th class="r">Lines</th></tr></thead><tbody>${wipRows}</tbody></table></div></div>
    <div><h3>Actuals (Upload Synchro booking)</h3>${bk.length?`<div class="tbl-wrap"><table><thead><tr><th>Uploaded</th><th>File</th><th>Process</th><th class="r">Lines booked</th><th class="r">MT</th><th>By</th></tr></thead><tbody>${bk.slice().reverse().slice(0,15).map(u=>`<tr><td>${fdt(u.ts)}</td><td>${esc(u.file||'')}</td><td>${esc((u.pids||[]).join(', '))}</td><td class="r num">${fmt(u.rows)}</td><td class="r num">${mt(u.kg)}</td><td>${esc(u.by)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty" style="padding:10px">No booking upload in this period.</div>'}
      <p class="small muted">Actuals also come from Execution entry (day plan and UID search) and completed furnace loads.</p></div></div>
    <ul class="small" style="margin:8px 0 0 18px;padding:0">
      <li><b>Plan adherence</b> = planned pcs done by their plan day ÷ planned pcs, for plan days that are submitted or already over (published plans).</li>
      <li><b>Booked tonnage</b> = all actuals booked in the period (Synchro booking, search booking, day entry, furnace loads); <b>plan</b> = published plan MT of the period.</li>
      <li><b>Booked from other plan days</b> = actuals of castings planned for another day, or not planned at all (e.g. bookings before the plan was published).</li>
      <li><b>Capacity utilisation</b> = booked MT ÷ (capacity MT/day × working days in the period up to today). Capacity comes from Masters › Processes (default 5 MT) and day overrides.</li>
      <li><b>WIP, delayed WIP, agreed date</b> = latest WIP upload of each process; delay uses the stage lead times in Masters › Lead times.</li></ul></details>`;
}

function xlsxDownload(name, head, rows){

  const ws=XLSX.utils.aoa_to_sheet([head,...rows]); ws['!cols']=head.map(h=>({wch:Math.max(10,String(h).length+2)}));

}

  }
  if(kind==='short'){
    const rows=(await shortfallLines(from,to,pids)).map(l=>({station:l.pid+' '+procName(l.pid), dept:deptOfPid(l.pid), date:l.date, cust:l.cust||'', job:l.job, uid:l.uid, desc:l.desc||'', plan:l.plannedQty, act:l.actualQty||0, sq:l.shortQty, kg:+l.shortKg||0, _kg:+l.shortKg||0, reason:l.reason||'(no reason)', rmk:l.remarks||'', _cls:'rowbad'}));
    return reportDialog('Shortfall – details', `${per} · ${rows.length} line(s)`, [C_D('date','Plan day'),C_T('reason','Reason'),C_T('station','Station'),C_T('dept','Department'),C_T('cust','Customer'),C_T('job','Job'),C_T('uid','UID'),C_T('desc','Description'),C_N('plan','Planned'),C_N('act','Actual'),C_N('sq','Shortfall'),C_N('kg','Shortfall kg',1),C_T('rmk','Remarks')], rows, {groupBy:'reason', groupLabel:'reason'});
  }
  if(kind==='adh'){
    const pairs=[]; Object.entries(S.sums||{}).forEach(([d,o])=>{ if(d<from||d>to) return; Object.keys(o).forEach(pid=>{ if(pids.includes(pid)&&o[pid].pq) pairs.push([d,pid,o[pid]]); }); });
    const docs=await Store.getMany(pairs.map(([d,pid])=>'plan/'+d+'/'+pid)); const rows=[];
    docs.forEach((p,i)=>{ if(!p) return; const [d,pid,sm]=pairs[i]; const closed=sm.submitted||d<today;
      p.lines.forEach(l=>{ const b=Math.min(l.qty,bookedQty(l,d)); const all=bookedQty(l); const st=b>=l.qty?'Done on plan day':!closed?'Plan day still open':all>=l.qty?'Done later':all>0?'Partly done':'Not done';
        rows.push({station:pid+' '+procName(pid), dept:deptOfPid(pid), date:d, status:st, cust:l.cust||'', job:l.job, uid:l.uid, desc:descOf(l), prio:l.groupLabel, qty:l.qty, done:b, kg:l.kg, _kg:l.kg,
          when:(l.bookings||[]).map(x=>fdate(x.date)+' ×'+x.qty).join(', '), _cls:st==='Not done'||st==='Done later'||st==='Partly done'?'rowbad':''}); }); });
    rows.sort((a,b)=>a.date<b.date?1:-1);
    return reportDialog('Plan adherence – planned lines', `${per} · ${rows.length} planned line(s) · ${rows.filter(r=>r.status==='Done on plan day').length} done on their plan day`,
      [C_D('date','Plan day'),C_T('status','Status'),C_T('station','Station'),C_T('prio','Priority'),C_T('cust','Customer'),C_T('job','Job'),C_T('uid','UID'),C_T('desc','Description'),C_N('qty','Planned'),C_N('done','Done by plan day'),C_N('kg','Planned kg',1),C_T('when','Booked on')], rows, {groupBy:'status', groupLabel:'status'});
  }
  if(kind==='cap'){
    const rows=[]; const end=to<today?to:today;
    for(let d=from; d<=end; d=E.addDays(d,1)) pids.forEach(pid=>{ const pr=procById(pid); if(!pr||!E.isWorkDay(d,pr,S.cfg.holidays)) return; const s=(S.sums[d]||{})[pid]||{}; const bk=(s.tkg!==undefined?s.tkg:s.akg)||0; const cap=capFor(pid,d)*1000;
      rows.push({date:d, station:pid+' '+procName(pid), dept:deptOfPid(pid), cap:cap/1000, plan:(s.pkg||0)/1000, bk:bk/1000, util:cap?Math.round(1000*bk/cap)/10:null, _kg:bk, _cls:cap&&bk/cap<ragA()/100?'rowbad':''}); });
    rows.sort((a,b)=>a.date<b.date?1:-1);

  }
  if(kind==='cf'){
    const rows=S.cfOpen.filter(x=>pids.includes(x.processId)).map(x=>({station:x.processId+' '+procName(x.processId), dept:deptOfPid(x.processId), from:x.fromDate, status:x.status, planned:x.plannedOn||'', uid:x.uid, job:x.job||'', qty:x.qty, kg:x.kg, _kg:x.kg, reason:x.reason||''}));
    return reportDialog('Open carry-forward', `${rows.length} line(s)`, [C_T('station','Station'),C_D('from','From plan day'),C_T('status','Status'),C_D('planned','Re-planned for'),C_T('uid','UID'),C_T('job','Job'),C_N('qty','Qty'),C_N('kg','kg',1),C_T('reason','Reason')], rows);
  }
}
async function shortfallLines(from,to,pids){
  const pairs=[]; Object.entries(S.sums||{}).forEach(([d,o])=>{ if(d<from||d>to) return; Object.keys(o).forEach(pid=>{ if(pids.includes(pid)&&o[pid].sq) pairs.push([d,pid]); }); });
  const docs=await Store.getMany(pairs.map(([d,pid])=>'exec/'+d+'/'+pid)); const out=[];
  docs.forEach((x,i)=>{ if(x) (x.lines||[]).forEach(l=>{ if(l.shortQty>0) out.push({...l, date:pairs[i][0], pid:pairs[i][1]}); }); }); return out;
}

/* ===================== TREND (day / week / month) ===================== */
/* The period buttons choose the granularity: Day = last 30 days, Week = last 13 weeks, Month / Year = last 12 months,
   Custom = daily (≤ 62 days) or weekly. Tonnage is shown per process (never added up), adherence for all processes. */
function trendBuckets(kind, anchor, from, to){
  const MON=d=>new Date(Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,1)).toLocaleString('en-GB',{month:'short',year:'2-digit',timeZone:'UTC'});
  const mEnd=ym=>{ const y=+ym.slice(0,4), m=+ym.slice(5,7); return ym+'-'+String(new Date(Date.UTC(y,m,0)).getUTCDate()).padStart(2,'0'); };
  const span=Math.round((Date.parse(to)-Date.parse(from))/864e5)+1;
  if(kind==='Day' || (kind==='Custom' && span<=62)){ const n=kind==='Day'?30:span; const end=kind==='Day'?anchor:to;
    return {g:'day', b:[...Array(n).keys()].map(i=>{ const d=E.addDays(end,i-n+1); return {k:d, label:d.slice(8)+'/'+d.slice(5,7), from:d, to:d}; })}; }
  if(kind==='Week' || kind==='Custom'){ const n=kind==='Week'?13:Math.ceil(span/7); const end=E.weekStart(kind==='Week'?anchor:to);
    return {g:'week', b:[...Array(n).keys()].map(i=>{ const w=E.addDays(end,(i-n+1)*7); return {k:w, label:fdate(w).slice(0,6), from:w, to:E.addDays(w,6)}; })}; }
  const out=[]; let y=+anchor.slice(0,4), m=+anchor.slice(5,7);
  for(let i=0;i<12;i++){ const ym=y+'-'+String(m).padStart(2,'0'); out.unshift({k:ym, label:MON(ym+'-01'), from:ym+'-01', to:mEnd(ym)}); m--; if(!m){ m=12; y--; } }
  return {g:'month', b:out};
}
function trendView(el, pidsAll, kind, anchor, from, to){
  const today=E.todayISO(); const procs=pidsAll.filter(id=>procById(id) && procById(id).type!=='HT');
  if(!procs.length){ el.innerHTML=''; return; }
  const proc=S.ui.trProc && procs.includes(S.ui.trProc)? S.ui.trProc : procs[0];
  const {g, b}=trendBuckets(kind, anchor, from, to);
  const unit={day:'day',week:'week',month:'month'}[g];
  const calc=(bk,pid)=>{ const a={pq:0,aqC:0,pqC:0,pkg:0,akgC:0,pkgC:0,tq:0,tkg:0,sq:0,target:0,targetToDate:0};
    for(let d=bk.from; d<=bk.to; d=E.addDays(d,1)){ const x=(S.sums[d]||{})[pid]; const p=procById(pid);
      if(p && E.isWorkDay(d,p,S.cfg.holidays)){ const c=capFor(pid,d)*1000; a.target+=c; if(d<today || (d===today && x && ((x.tkg??x.akg)>0))) a.targetToDate+=c; }   // today counts once something is booked
      if(!x) continue; a.pq+=x.pq; a.pkg+=x.pkg; a.tq+=(x.tq??x.aq)||0; a.tkg+=(x.tkg??x.akg)||0; a.sq+=x.sq||0;
      if(x.submitted||d<today){ a.pqC+=x.pq; a.aqC+=x.aq; a.pkgC+=x.pkg; a.akgC+=x.akg; } }
    a.ad=a.pqC?100*a.aqC/a.pqC:null; a.ofPlan=a.pkg?100*a.tkg/a.pkg:null; a.ofT=a.targetToDate?100*a.tkg/a.targetToDate:null; a.future=bk.from>today; return a; };
  const P={}; procs.forEach(pid=>P[pid]=b.map(bk=>calc(bk,pid)));
  const S1=P[proc]; const last=b.reduce((k,bk,i)=>bk.from<=today?i:k,-1);
  // cards: latest day / week / month that already has data (today without a plan is skipped)
  let ci=last; while(ci>0 && !S1[ci].pqC && !S1[ci].tkg) ci--;
  const cur=S1[ci]||{}, prv=S1[ci-1]||{}; const running=b[ci] && b[ci].to>=today && g!=='day';
  const closedIdx=b.map((bk,i)=>i).filter(i=>S1[i].pqC);
  const avgAd=closedIdx.length?100*closedIdx.reduce((s,i)=>s+S1[i].aqC,0)/closedIdx.reduce((s,i)=>s+S1[i].pqC,0):null;
  const on=closedIdx.filter(i=>S1[i].ad>=ragG()).length;
  const arrow=(c,p,u)=>c===null||c===undefined||p===null||p===undefined||isNaN(c)||isNaN(p)?'':`<span class="dlt ${c>=p?'up':'down'}">${c>=p?'▲':'▼'} ${Math.abs(c-p).toFixed(u==='%'?1:2)}${u} vs previous ${unit}</span>`;
  const curLbl=b[ci]?b[ci].label+(running?' (so far)':''):'';
  el.innerHTML=`<div class="trhead"><h2 style="margin:0">${{day:'Day-wise',week:'Week-wise',month:'Month-wise'}[g]} trend <span class="small muted">(${b.length} ${unit}s – change with Day / Week / Month above)</span></h2>
      <div class="seg" role="group" aria-label="Process">${procs.map(id=>`<button data-trp="${id}" aria-pressed="${id===proc}">${esc(id+' '+procName(id))}</button>`).join('')}</div></div>
    <div class="deck small4">
      ${dcard(`Adherence – ${esc(curLbl)}`, pctTxt(cur.ad), `${fmt(cur.aqC||0)} of ${fmt(cur.pqC||0)} planned pcs · `+arrow(cur.ad,prv.ad,'%'), ragClass(cur.ad))}
      ${dcard(`Booked – ${esc(curLbl)}`, mt(cur.tkg||0)+' <small>MT</small>', `plan ${mt(cur.pkg||0)} MT · ${pctTxt(cur.ofPlan)} of plan · `+arrow((cur.tkg||0)/1000,(prv.tkg||0)/1000,' MT'), ragClass(cur.ofPlan))}
      ${dcard(`vs target – ${esc(curLbl)}`, pctTxt(cur.ofT), `target to date ${mt(cur.targetToDate||0)} MT (working days × MT/day)`, ragClass(cur.ofT))}
      ${dcard(`Average adherence – ${b.length} ${unit}s`, pctTxt(avgAd), `${on} of ${closedIdx.length} ${unit}(s) ≥ ${ragG()}%`, ragClass(avgAd))}
    </div>
    <div class="grid g2" style="margin-top:12px">
      <div class="panel"><h3>Plan vs actual tonnage – ${esc(proc+' '+procName(proc))}</h3><div class="ch" style="height:290px"><canvas id="tr1"></canvas></div></div>
      <div class="panel"><h3>Plan adherence % – ${procs.length>1?'all processes':esc(proc+' '+procName(proc))}</h3><div class="ch" style="height:290px"><canvas id="tr2"></canvas></div></div>
      <div class="panel"><h3>Plan vs actual quantity (pcs) – ${esc(proc+' '+procName(proc))}</h3><div class="ch" style="height:270px"><canvas id="tr3"></canvas></div></div>
      <div class="panel"><h3>${g==='month'&&b[last]&&b[last].k===today.slice(0,7)?esc(b[last].label)+' – cumulative booked vs target':'Booked vs target % – '+(procs.length>1?'all processes':esc(proc))}</h3><div class="ch" style="height:270px"><canvas id="tr4"></canvas></div></div>
    </div>
    <details class="panel" style="margin-top:10px"><summary style="cursor:pointer"><b>${{day:'Day',week:'Week',month:'Month'}[g]}-wise table</b> <span class="small muted">plan, actual and adherence per process</span></summary>
      <div class="tbl-wrap" style="max-height:420px;margin-top:8px"><table class="dwt"><thead><tr><th rowspan="2">${{day:'Day',week:'Week from',month:'Month'}[g]}</th>${procs.map(pid=>`<th colspan="5" class="c">${esc(pid+' '+procName(pid))}</th>`).join('')}</tr>
        <tr>${procs.map(()=>'<th class="r">Plan MT</th><th class="r">Booked MT</th><th class="r">Plan pcs</th><th class="r">Done pcs</th><th class="r">Adherence</th>').join('')}</tr></thead><tbody>
        ${b.map((bk,i)=>({bk,i})).filter(({bk})=>bk.from<=today).reverse().map(({bk,i})=>`<tr><td>${esc(bk.label)}</td>${procs.map(pid=>{ const a=P[pid][i]; return `<td class="r num">${a.pkg?mt(a.pkg):''}</td><td class="r num">${a.tkg?mt(a.tkg):''}</td><td class="r num">${a.pq?fmt(a.pq):''}</td><td class="r num">${a.pqC?fmt(a.aqC):''}</td><td class="r">${a.pqC?`<span class="badge" style="background:${ragColor(a.ad)}">${pctTxt(a.ad)}</span>`:''}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div></details>`;
  el.querySelectorAll('[data-trp]').forEach(x=>x.onclick=()=>{ S.ui.trProc=x.dataset.trp; trendView(el,pidsAll,kind,anchor,from,to); });
  if(typeof Chart==='undefined') return;
  const base={maintainAspectRatio:false, interaction:{mode:'index',intersect:false}, plugins:{legend:{position:'bottom',labels:{boxWidth:12}}}};
  const lab=b.map(x=>x.label);
  const fut=i=>b[i].from>today || (b[i].from===today && !S1[i].pq && !S1[i].tq) || (g==='day' && !S1[i].target && !S1[i].pq && !S1[i].tq);   // future, empty today, off days
  mkChart($('#tr1'),{type:'bar',data:{labels:lab,datasets:[
      {label:'Planned MT',data:S1.map((a,i)=>g==='day'&&!a.pq&&!a.target?null:a.pkg/1000),backgroundColor:'#B9C9D8',borderRadius:4},
      {label:'Booked MT',data:S1.map((a,i)=>fut(i)?null:a.tkg/1000),backgroundColor:S1.map(a=>a.pkg?ragColor(a.ofPlan):'#3E6283'),borderRadius:4},
      {type:'line',label:'Target MT',data:S1.map(a=>g==='day'&&!a.target?null:a.target/1000),spanGaps:false,borderColor:'#1C2733',borderDash:[5,4],pointRadius:g==='day'?0:2,borderWidth:1.5}]},
    options:{...base,scales:{y:{beginAtZero:true,title:{display:true,text:'MT'}}}}});
  mkChart($('#tr2'),{type:'line',data:{labels:lab,datasets:[...procs.map((pid,k)=>{ const v=P[pid].map(a=>a.ad); return {label:pid+' '+procName(pid),data:v,borderColor:PAL[k%PAL.length],backgroundColor:PAL[k%PAL.length],spanGaps:true,tension:.3,borderWidth:pid===proc?3:1.5,
        pointRadius:pid===proc?4:2,pointBackgroundColor:v.map(x=>x===null?PAL[k%PAL.length]:ragColor(x)),pointBorderColor:v.map(x=>x===null?PAL[k%PAL.length]:ragColor(x))}; }),
      {label:'Target '+ragG()+'%',data:b.map(()=>ragG()),borderColor:'#2D7A4C',borderDash:[6,4],pointRadius:0,borderWidth:1.5}]},
    options:{...base,scales:{y:{min:0,suggestedMax:110,ticks:{callback:v=>v+'%'}}}}});
  mkChart($('#tr3'),{type:'bar',data:{labels:lab,datasets:[
      {label:'Planned pcs',data:S1.map(a=>a.pq),backgroundColor:'#B9C9D8',borderRadius:4},
      {label:'Done on plan pcs',data:S1.map((a,i)=>fut(i)?null:a.aqC),backgroundColor:S1.map(a=>ragColor(a.ad)),borderRadius:4},
      {type:'line',label:'All booked pcs',data:S1.map((a,i)=>fut(i)?null:a.tq),borderColor:'#D9730D',backgroundColor:'#D9730D',pointRadius:2,tension:.2}]},

  if(g==='month' && b[last] && b[last].k===today.slice(0,7)){
    const md=[]; for(let d=b[last].from; d<=b[last].to; d=E.addDays(d,1)) md.push(d);

    const wd=md.filter(d=>d<=today&&cap(d)>0).length, rate=wd?cb/wd:0; let k=0;
    mkChart($('#tr4'),{type:'line',data:{labels:md.map(d=>d.slice(8)),datasets:[
        {label:'Booked (cumulative)',data:bu.map(x=>x.b),borderColor:'#D9730D',backgroundColor:'rgba(217,115,13,.12)',fill:true,tension:.2,pointRadius:2},
        {label:'Target (cumulative)',data:bu.map(x=>x.t),borderColor:'#2D7A4C',borderDash:[6,4],pointRadius:0},
        {label:'Plan (cumulative)',data:bu.map(x=>x.p),borderColor:'#3E6283',pointRadius:0},
        {label:'Forecast at current rate',data:md.map(d=>{ if(cap(d)>0) k++; return d>=today? +(rate*k).toFixed(3):null; }),borderColor:'#D9730D',borderDash:[2,4],pointRadius:0}]},
      options:{...base,scales:{y:{beginAtZero:true,title:{display:true,text:'MT'}}}}});
  } else {
