      <label class="field">Processing delay reason (if cycle overran)<select id="bpd"><option value="">–</option>${reasons.map(r=>`<option>${esc(r)}</option>`).join('')}</select></label></div>
      <div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>UID</th><th>Tooling no.</th><th>Description</th><th>Metallurgy</th><th class="r">Planned</th><th>Actual</th><th>Shortfall reason</th><th>Remarks</th></tr></thead><tbody>
      ${b.items.map((x,i)=>`<tr><td>${esc(x.uid)}</td><td>${esc(toolOf(x))}</td><td class="wrap">${esc(descOf(x))}</td><td>${esc(x.met)}</td><td class="r num">${x.qty}</td><td><input type="number" min="0" step="1" data-ba="${i}" value="${x.qty}"></td>
      <td><select data-br="${i}"><option value="">–</option>${reasons.map(r=>`<option>${esc(r)}</option>`).join('')}</select></td><td><input data-bm="${i}" style="width:150px"></td></tr>`).join('')}</tbody></table></div>`;
    return modal('Complete batch '+b.id+' – '+b.recipeName, body, [{label:'Save completion',cls:'heat',fn:async d=>{
      const end=new Date(d.querySelector('#be').value).toISOString(); const st=b.actualStart||b.plannedStart;
      const dur=E.hoursBetween(st,end); const pdr=d.querySelector('#bpd').value;
      if(dur>b.cycleH+0.5 && !pdr){ d.querySelector('#bpd').classList.add('invalid'); toast('The cycle ran '+fmt(dur-b.cycleH,1)+' h longer than standard. Choose a processing delay reason.',true); return false; }
      let bad=false; const hp=htProc(); const planDate=localISO(new Date(b.plannedStart));
      const ex=b.items.map((x,i)=>{ const a=Math.max(0,Math.round(+d.querySelector(`[data-ba="${i}"]`).value||0)); const sf=Math.max(0,x.qty-a); const r=d.querySelector(`[data-br="${i}"]`).value;
        if(sf>0 && !r){ d.querySelector(`[data-br="${i}"]`).classList.add('invalid'); bad=true; }
        return {planLineId:null, batchId:b.id, key:x.key, uid:x.uid, job:x.job, part:x.part, die:toolOf(x), desc:descOf(x), met:x.met, cust:x.cust||'', plannedQty:x.qty, plannedKg:x.kg, unitWt:x.unitWt,
          actualQty:a, actualKg:a*x.unitWt, shortQty:sf, shortKg:sf*x.unitWt, reason:sf>0?r:'', remarks:d.querySelector(`[data-bm="${i}"]`).value.trim(), cfIds:x.cfIds||[]}; });
      if(bad){ toast('Choose a shortfall reason for every short line.',true); return false; }
      const rec=S.cfg.recipes.find(r=>r.id===b.recipeId)||{sequence:1};
      const fin={...b, status:'Completed', actualStart:st, actualEnd:end, actualH:dur, actualKg:ex.reduce((s,x)=>s+x.actualKg,0), overrunH:Math.max(0,dur-b.cycleH), delayReason:pdr, completedBy:S.user.username};
      await Store.update('exec/'+planDate+'/'+hp.id, x=>{ x=x||{date:planDate,processId:hp.id,status:'Batch',lines:[]}; x.lines.push(...ex); return x; });
      await applyCarryForward(planDate, hp.id, ex);
      S.htProgress=await Store.update('ht/progress', p=>{ p=p||{}; ex.forEach(x=>{ if(x.shortQty===0) p[x.key]=Math.max(p[x.key]||0, rec.sequence||1); }); return p; });
      if(routingOn()){ const reqs=ex.filter(x=>x.actualQty>0 && !E.recipeChain(x.met,S.cfg.recipes).some(r=>(r.sequence||1)>(S.htProgress[x.key]||0))).map(x=>({key:x.key, qty:x.actualQty}));
        fin.moves=await transferWip(planDate, hp.id, reqs); }
      await Store.update('ht/done/'+end.slice(0,7), x=>{ x=x||{batches:[]}; x.batches.push(fin); return x; });
      S.ht=await Store.update('ht/active', x=>{ x.batches=x.batches.filter(z=>z.id!==id); return x; });
      await Store.update('planidx', x=>{ x=x||{dates:{}}; x.dates[planDate]=Array.from(new Set([...(x.dates[planDate]||[]),hp.id])); return x; });
      await recomputeSummary(planDate, hp.id);
      await audit('Complete HT batch', id+' – actual '+fmt(fin.actualKg)+' kg, '+fmt(dur,1)+' h'+(pdr?' (delay: '+pdr+')':''));
      if(routingOn()){ await reloadWip(); await writeSnapshot(E.todayISO()); } else { await loadReported(); derive(); } go('ht'); }}]);
  }
}
/* Gantt: one lane per furnace, coloured by batch state; red line = now */
function drawGantt(el, batches, startISO, hz){
  const t0=Math.min(new Date(startISO).getTime(), Date.now())-12*3600000; const t1=new Date(startISO).getTime()+hz*3600000;
  const pxh=6, L=110, W=L+(t1-t0)/3600000*pxh+20, laneH=58, top=30; const fs=S.cfg.furnaces; const H=top+fs.length*laneH+10;
  const x=t=>L+(t-t0)/3600000*pxh;
  let g=`<svg width="${W}" height="${H}" role="img" aria-label="Furnace schedule">`;
  const md=new Date(t0); md.setHours(24,0,0,0);
  for(let t=md.getTime(); t<t1; t+=86400000){ const xx=x(t);
    g+=`<line x1="${xx}" y1="${top-6}" x2="${xx}" y2="${H}" stroke="#D5DCE3"/><text x="${xx+4}" y="${top-12}" font-size="11" fill="#5A6977">${fdate(localISO(new Date(t)))}</text>`; }
  fs.forEach((f,i)=>{ const y=top+i*laneH; g+=`<rect x="0" y="${y}" width="${W}" height="${laneH}" fill="${i%2?'#FAFBFC':'#fff'}"/><text x="10" y="${y+24}" font-size="13" font-weight="600" fill="#16212C">${esc(f.name)}</text><text x="10" y="${y+40}" font-size="11" fill="#5A6977">${esc(f.status)}</text>`; });
  batches.forEach(b=>{ const i=fs.findIndex(f=>f.id===b.furnaceId); if(i<0) return;
    const s=new Date(b.actualStart||b.plannedStart).getTime(), e=new Date(b.actualEnd||b.plannedEnd).getTime(); if(e<t0||s>t1) return;
    const xs=Math.max(L,x(s)), xe=Math.min(W-20,x(e)), y=top+i*laneH+8;
    const fill=b.status==='Running'?'url(#heat)':b.status==='Completed'?'#B9C3CD':'#3E6283';
    const tip=`${b.id} · ${b.recipeName} · ${fmt(b.kg)} kg · ${b.items.length} lines · ${fdt(b.actualStart||b.plannedStart)} → ${fdt(b.actualEnd||b.plannedEnd)} · ${b.status}`;
    g+=`<g><title>${esc(tip)}</title><rect x="${xs}" y="${y}" width="${Math.max(3,xe-xs)}" height="${laneH-16}" rx="3" fill="${fill}"/>`+
       (xe-xs>60?`<text x="${xs+6}" y="${y+17}" font-size="11" fill="#fff">${esc(b.recipeName.slice(0,Math.floor((xe-xs)/6)))}</text><text x="${xs+6}" y="${y+32}" font-size="11" fill="#fff">${fmt(b.kg)} kg</text>`:'')+'</g>'; });
  const nx=x(Date.now()); g+=`<line x1="${nx}" y1="${top-6}" x2="${nx}" y2="${H}" stroke="#B8322A" stroke-width="2"/><text x="${nx+4}" y="${H-4}" font-size="10" fill="#B8322A">now</text>`;
  g+=`<defs><linearGradient id="heat" x1="0" x2="1"><stop offset="0" stop-color="#B84A00"/><stop offset=".6" stop-color="#E07A10"/><stop offset="1" stop-color="#F2A33A"/></linearGradient></defs></svg>`;
  el.innerHTML=g;
}

function recipeSchedule(){

function rangeFor(kind, anchor){
  if(kind==='Day') return [anchor,anchor];
  if(kind==='Week'){ const s=E.weekStart(anchor); return [s,E.addDays(s,6)]; }
  if(kind==='Month'){ const s=anchor.slice(0,7)+'-01'; const n=new Date(Date.UTC(+anchor.slice(0,4),+anchor.slice(5,7),0)).getUTCDate(); return [s, anchor.slice(0,7)+'-'+pad(n)]; }
  if(kind==='Year') return [anchor.slice(0,4)+'-01-01', anchor.slice(0,4)+'-12-31'];
  return [S.ui.dFrom||anchor, S.ui.dTo||anchor];
}
/* Adherence counts only closed plan days (actuals submitted, or the day is over), so a plan still being worked on is not shown as 0 %. */
function agg(from,to,pid){
  const a={pq:0,pkg:0,aq:0,akg:0,sq:0,skg:0,cap:0,capAkg:0,pqC:0,pkgC:0,aqC:0,akgC:0,pending:0,reasons:{}}; const today=E.todayISO();
  Object.entries(S.sums).forEach(([d,v])=>{ if(d<from||d>to) return; Object.entries(v).forEach(([p,s])=>{ if(pid && p!==pid) return;
    a.pq+=s.pq; a.pkg+=s.pkg; a.aq+=s.aq; a.akg+=s.akg; a.sq+=s.sq; a.skg+=s.skg;
    const closed=s.submitted || d<today;
    if(closed){ a.pqC+=s.pq; a.pkgC+=s.pkg; a.aqC+=s.aq; a.akgC+=s.akg; if(s.capKg){ a.cap+=s.capKg; a.capAkg+=s.akg; } } else if(s.pq>0) a.pending++;
    Object.entries(s.reasons||{}).forEach(([r,x])=>{ const t=a.reasons[r]=a.reasons[r]||{q:0,kg:0}; t.q+=x.q; t.kg+=x.kg; }); }); });
  a.adq=pct(a.aqC,a.pqC); a.adw=pct(a.akgC,a.pkgC); a.util=pct(a.capAkg,a.cap); return a;
}

const DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function editorTable(id, cols, rows){
  const cell=(c,r,i)=>{ const v=r[c.k]; const a=`data-r="${i}" data-k="${c.k}"`;
    if(c.t==='ro') return `<span class="small muted">${esc(c.f?c.f(r):v)}</span>`;
    if(c.t==='sel') return `<select ${a}>${c.o.map(o=>`<option ${String(o)===String(v)?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    if(c.t==='chk') return `<input type="checkbox" ${a} ${v?'checked':''}>`;
    if(c.t==='days') return DAYN.map((d,j)=>`<label class="small" style="margin-right:4px"><input type="checkbox" data-r="${i}" data-k="${c.k}" data-day="${j}" ${(v||[]).includes(j)?'checked':''}>${d}</label>`).join('');
    if(c.t==='num') return `<input type="number" step="any" ${a} value="${v??''}" style="width:${c.w||90}px">`;
    if(c.t==='date') return `<input type="date" ${a} value="${v||''}">`;
    if(c.t==='dt') return `<input type="datetime-local" ${a} value="${dtLocalVal(v)}">`;
    if(c.t==='pw') return `<input type="password" ${a} placeholder="${(Store.mode==='firebase'?r.uid:r.pin)?'unchanged':(Store.mode==='firebase'?'set password':'set PIN')}" style="width:110px">`;
    return `<input ${a} value="${esc(c.f?c.f(r):v??'')}" style="width:${c.w||140}px">`; };
  return `<div class="tbl-wrap"><table id="${id}"><thead><tr>${cols.map(c=>`<th title="${esc(c.h||'')}">${esc(c.l)}</th>`).join('')}<th></th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr>${cols.map(c=>`<td>${cell(c,r,i)}</td>`).join('')}<td><button class="btn danger sm" data-del="${i}">Delete</button></td></tr>`).join('')}</tbody></table></div>`;
}
function readEditor(id, cols, rows){
  const out=rows.map(r=>({...r})); const tbl=document.getElementById(id);
  tbl.querySelectorAll('[data-k]').forEach(el=>{ const r=out[+el.dataset.r]; const c=cols.find(x=>x.k===el.dataset.k); if(!c) return;
    if(c.t==='days'){ if(!r.__d){ r.__d=true; r[c.k]=[]; } if(el.checked) r[c.k].push(+el.dataset.day); return; }
    if(c.t==='chk') r[c.k]=el.checked; else if(c.t==='num') r[c.k]=el.value===''?'':+el.value; else if(c.t==='dt') r[c.k]=el.value?new Date(el.value).toISOString():''; else if(c.t==='pw'){ if(el.value) r.__pin=el.value; } else if(c.p) c.p(r,el.value); else r[c.k]=el.value.trim(); });
  out.forEach(r=>delete r.__d); return out;
}

async function saveUsers(rows){
  if(Store.mode!=='firebase') return rows.map(u=>{ const x={...u}; if(x.__pin){ x.pin=pinHash(x.username,x.__pin); delete x.demo; } delete x.__pin; delete x.pinNew; return x; });
  const out=[];
  for(const u of rows){
    const x={...u}; x.username=normUser(x.username);
    if(!x.uid){ try{ x.uid=await fbCreateAccount(x.username, x.__pin); }
      catch(e){ throw new Error('Could not create '+x.username+': '+(e.code==='auth/email-already-in-use'?'that user name already has an account (it may belong to a deleted user – choose another name).':e.message)); } }
    else if(x.__pin && x.username===S.user.username){ try{ await Store.auth.currentUser.updatePassword(x.__pin); }catch(e){ throw new Error('Password not changed: '+(e.code==='auth/requires-recent-login'?'sign out, sign in again and retry.':e.message)); } }
    delete x.__pin; delete x.pinNew; delete x.pin; delete x.demo; out.push(x);
  }
  const uids={}; out.forEach(u=>{ uids[u.uid]=u.role; });
  await setAccess(uids);                     // removed users lose access immediately
  await audit('Users', out.length+' users; access list updated');
  return out;
}
function validateMaster(tab, rows){
  if(tab==='LT exceptions'){ if(rows.some(r=>!r.metallurgy && !r.part)) return 'An exception needs a Metallurgy or a Part (stage-wide values go in the stage table above).'; if(rows.some(r=>r.value===''||+r.value<=0)) return 'Every exception needs a lead time greater than zero.'; return null; }
  if(tab==='Processes'){ const ids=rows.map(r=>r.id); if(ids.some(x=>!x)) return 'Every process needs a Process ID.'; if(new Set(ids).size!==ids.length) return 'Process IDs must be unique.'; if(rows.filter(r=>r.type==='HT'&&r.active).length>1) return 'Only one active process can be of type HT.'; }
  if(tab==='Lead times'){ if(rows.some(r=>r.value===''||+r.value<=0)) return 'Every lead time needs a value greater than zero.'; }
  if(tab==='HT recipes'){ if(rows.some(r=>!r.id||!r.metallurgies)) return 'Every recipe needs an ID and at least one metallurgy.'; if(rows.some(r=>r.status==='Active' && !(E.cycleHours(r)>0))) return 'An active recipe needs a cycle time (stages with hours).'; if(new Set(rows.map(r=>r.id)).size!==rows.length) return 'Recipe IDs must be unique.'; }
  if(tab==='Routing'){ const ids=new Set(S.cfg.processes.map(p=>p.id));
    for(const r of rows){ const st=routeSteps(r); if(!r.name) return 'Every routing rule needs a name.'; if(st.length<1) return 'Rule '+r.name+' has no stages.';
      const bad=st.filter(x=>!ids.has(x)); if(bad.length) return 'Rule '+r.name+': unknown process ID '+bad.join(', ')+'.'; if(new Set(st).size!==st.length) return 'Rule '+r.name+' lists a stage twice.'; } }
  if(tab==='Furnaces'){ if(rows.some(r=>!r.id||!(+r.capacityKg>0))) return 'Every furnace needs an ID and a capacity.'; }
  if(tab==='Users'){ rows.forEach(r=>{ r.username=normUser(r.username); }); const un=rows.map(r=>r.username); if(un.some(x=>!x)) return 'Every user needs a user name.'; if(new Set(un).size!==un.length) return 'User names must be unique.';
    if(!rows.some(r=>r.role==='Admin')) return 'Keep at least one Admin.';
    if(rows.some(r=>!/^[a-z0-9._-]{2,30}$/i.test(r.username))) return 'User names may use letters, digits, dot, dash and underscore only (no spaces).';
    if(Store.mode==='firebase'){ if(rows.some(r=>!r.uid && !(r.__pin && r.__pin.length>=6))) return 'Set a password of at least 6 characters for every new user.';
      if(rows.some(r=>r.uid && r.__pin && r.username!==S.user.username)) return 'You can only change your own password here. For another user: delete the row and create the user again with a new user name, or reset it in the Firebase console.'; }
    else if(rows.some(r=>!r.pin && !r.__pin)) return 'Set a PIN for every new user.'; }
  return null;
}

    const procs=sortedProcs().filter(p=>!pid||p.id===pid); const paths=[]; dates.forEach(d=>procs.forEach(p=>{ paths.push('plan/'+d+'/'+p.id); paths.push('exec/'+d+'/'+p.id); }));
    const docs=await Store.getMany(paths); const out=[]; let k=0;
    dates.forEach(d=>procs.forEach(p=>{ const pl=docs[k++], ex=docs[k++]; const xb={}; ((ex&&ex.lines)||[]).forEach(l=>{ (xb[l.planLineId||l.key]=xb[l.planLineId||l.key]||[]).push(l); });
      const used=new Set();
      ((pl&&pl.lines)||[]).forEach(l=>{ const x=(xb[l.id]||xb[l.key]||[])[0]; if(x) used.add(x); out.push([d,p.id,l.uid,l.job,toolOf(l),descOf(l),l.met,l.groupLabel,l.qty,fmt(l.kg,1),x?x.actualQty:'',x?x.shortQty:'',x?x.reason:'',x?x.remarks:'',ex?ex.status:'No actuals',pl.publishedBy]); });
      ((ex&&ex.lines)||[]).filter(x=>!used.has(x)).forEach(x=>out.push([d,p.id,x.uid,x.job,toolOf(x),descOf(x),x.met,'Unplanned (batch '+(x.batchId||'')+')','',fmt(0,1),x.actualQty,x.shortQty,x.reason,x.remarks,ex.status,''])); }));
    const H=['Date','Process','UID','Job','Tooling no.','Description','Metallurgy','Priority','Planned qty','Planned kg','Actual qty','Shortfall','Reason','Remarks','Status','Published by'];
    $('#hl').outerHTML=out.length?`<div class="tbl-wrap"><table><thead><tr>${H.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${out.slice(0,1500).map(r=>`<tr>${r.map((v,i)=>`<td class="${i>=8&&i<=11?'r num':''}">${i===0?fdate(v):esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">No plans in this range.</div>';
    $('#hx').onclick=()=>csv('plan_vs_actual_'+from+'_'+to+'.csv',[H,...out]);
    return;
  }
  hb.innerHTML=`<div class="row" style="margin-bottom:10px"><label class="field">Month<input type="month" id="hm" value="${month}"></label></div><div id="hl"></div>`;
  $('#hm').onchange=e=>{ S.ui.hMonth=e.target.value; go('history'); };
  if(tab==='Carry-forward'){
    const closed=((await Store.get('cf/closed/'+month))||{list:[]}).list; const all=[...S.cfOpen.filter(c=>c.fromDate.startsWith(month)),...closed];
    $('#hl').innerHTML=all.length?`<div class="tbl-wrap"><table><thead><tr><th>From</th><th>Process</th><th>UID</th><th>Job</th><th class="r">Qty</th><th class="r">kg</th><th>Reason</th><th>Status</th><th>Note</th><th>Priority</th></tr></thead><tbody>${all.sort((a,b)=>a.fromDate<b.fromDate?1:-1).map(c=>`<tr><td>${fdate(c.fromDate)}</td><td>${esc(c.processId)}</td><td>${esc(c.uid)}</td><td>${esc(c.job)}</td><td class="r num">${fmt(c.qty)}</td><td class="r num">${fmt(c.kg,1)}</td><td>${esc(c.reason)}</td><td><span class="chip ${c.status==='Open'?'warn':c.status==='Planned'?'blue':'mute'}">${c.status}</span></td><td class="small muted">${esc(c.closeNote||'')}</td><td>${esc(c.priority||'High')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No carry-forward records for this month.</div>';
    return;
  }
  if(tab==='Stage movements'){
    const [mvd,dn]=await Store.getMany(['moves/'+month,'wip/done/'+month]); const l=((mvd||{}).list||[]).slice().reverse();
    $('#hl').innerHTML=(l.length?`<div class="row" style="justify-content:flex-end;margin-bottom:6px"><button class="btn ghost sm" id="hmx">Export CSV</button></div><div class="tbl-wrap"><table><thead><tr><th>Date</th><th>UID</th><th>From</th><th>To</th><th class="r">Qty</th><th>Note</th><th>By</th></tr></thead><tbody>${l.map(x=>`<tr><td>${fdate(x.date)}</td><td>${esc(x.uid)}</td><td>${esc(x.from+' · '+procName(x.from))}</td><td>${x.to?esc(x.to+' · '+procName(x.to)):'<span class="chip ok">Finished</span>'}</td><td class="r num">${fmt(x.qty)}</td><td class="small">${esc(x.note||'')}</td><td>${esc(x.by)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No stage movements this month (movements happen in Routing mode).</div>')
      +`<div class="small muted" style="margin-top:8px">${((dn||{}).rows||[]).length} line(s) left WIP after their last stage this month.</div>`;
    if($('#hmx')) $('#hmx').onclick=()=>csv('stage_movements_'+month+'.csv',[['Date','UID','From','To','Qty','Note','By'],...l.map(x=>[x.date,x.uid,x.from,x.to||'Finished',x.qty,x.note,x.by])]);
    return;
  }
  const au=((await Store.get('audit/'+month))||{list:[]}).list.slice().reverse();
  $('#hl').innerHTML=au.length?`<div class="tbl-wrap"><table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Detail</th></tr></thead><tbody>${au.map(a=>`<tr><td>${fdt(a.ts)}</td><td>${esc(a.user)}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No audit entries for this month.</div>';
}

boot();

/* ---------- Lead times: one value per stage + optional exceptions ---------- */
function vLeadTimes(mb){
  const isStage=l=>!l.metallurgy && !l.part;
  const procs=sortedProcs().filter(p=>p.active);
  const stageRule=pid=>S.cfg.leadTimes.find(l=>l.processId===pid && isStage(l) && l.status!=='Inactive');
  const M=MASTERS['LT exceptions']; const cols=M.cols.map(c=>c.o && typeof c.o==='function'?{...c,o:c.o()}:c);
  const exc=JSON.parse(JSON.stringify(S.cfg.leadTimes.filter(l=>!isStage(l))));
  const render=(data)=>{
    mb.innerHTML=`<div class="panel" style="margin-bottom:14px"><h3>Stage lead time – applies to every casting in the stage</h3>
      <p class="small muted" style="margin-top:0">Target completion = date the casting reached the stage (Stage Start Date) + lead time. Enter one value per stage; that is all most stages need.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Process</th><th>Lead time</th><th>Unit</th><th>Effective from</th><th>Status</th></tr></thead><tbody>
      ${procs.map(p=>{ const r=stageRule(p.id)||{}; return `<tr><td><b>${esc(p.id)}</b> · ${esc(p.name)}${p.type==='HT'?' <span class="chip heat">HT</span>':''}</td>
        <td><input type="number" min="0" step="0.5" data-slt="${p.id}" value="${r.value??''}" placeholder="e.g. 2" style="width:80px"></td>
        <td><select data-slu="${p.id}"><option ${r.unit!=='Hours'?'selected':''}>Days</option><option ${r.unit==='Hours'?'selected':''}>Hours</option></select></td>
        <td><input type="date" data-sle="${p.id}" value="${r.effectiveFrom||E.todayISO()}"></td>
        <td>${r.value?'<span class="chip ok">Set</span>':'<span class="chip warn">Not set</span>'}</td></tr>`; }).join('')}</tbody></table></div>
      <div class="row" style="margin-top:10px"><button class="btn" id="sltsave">Save stage lead times</button><span class="small muted">Leave a value empty to remove it.</span></div></div>
      <h3>Exceptions (optional)</h3><p class="small muted">${esc(M.help)} Order of use: Part exception › Metallurgy exception › lead time on the routing operation › stage lead time.</p>
      ${data.length?editorTable('mt',cols,data):'<div class="empty" style="padding:14px">No exceptions.</div>'}
      <div class="row" style="margin-top:10px"><button class="btn ghost" id="madd">Add exception</button>${data.length?'<button class="btn" id="msave">Save exceptions</button>':''}</div>`;
    $('#sltsave').onclick=async()=>{
      const vals=procs.map(p=>({pid:p.id, v:mb.querySelector(`[data-slt="${p.id}"]`).value, u:mb.querySelector(`[data-slu="${p.id}"]`).value, e:mb.querySelector(`[data-sle="${p.id}"]`).value}));
      if(vals.some(x=>x.v!=='' && !(+x.v>0))) return toast('Lead times must be greater than zero.',true);
      await saveConfig(c=>{ const keep=c.leadTimes.filter(l=>!isStage(l)); const old=c.leadTimes.filter(isStage);
        vals.forEach(x=>{ if(x.v==='') return; const o=old.find(l=>l.processId===x.pid)||{};
          keep.push({id:o.id||uidGen('LT'), processId:x.pid, metallurgy:'', part:'', value:+x.v, unit:x.u, effectiveFrom:x.e||E.todayISO(), status:'Active', remarks:o.remarks||'Stage lead time'}); });
        c.leadTimes=keep; }, 'Stage lead times: '+vals.filter(x=>x.v!=='').map(x=>x.pid+'='+x.v+(x.u==='Hours'?'h':'d')).join(', '));
      derive(); if(S.wipMeta) await writeSnapshot(S.wipMeta.snapshotDate||E.todayISO()); toast('Stage lead times saved.'); go('masters'); };
    mb.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const cur=readEditor('mt',cols,data); cur.splice(+b.dataset.del,1); render(cur); });
    $('#madd').onclick=()=>{ const cur=data.length?readEditor('mt',cols,data):[]; cur.push(M.blank()); render(cur); };
    if($('#msave')) $('#msave').onclick=async()=>{ const cur=readEditor('mt',cols,data); const err=validateMaster('LT exceptions',cur); if(err) return toast(err,true);
      await saveConfig(c=>{ c.leadTimes=c.leadTimes.filter(isStage).concat(cur); }, 'Lead-time exceptions ('+cur.length+')'); derive(); toast('Exceptions saved.'); go('masters'); };
  };
  render(exc);
}

/* ---------- Routing master in Synchro style: route header + numbered operations ---------- */
function vRouting(mb){
  let data=JSON.parse(JSON.stringify(S.cfg.routes||[])).map(normRoute);
  const opts=sel=>sortedProcs().map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.id+' – '+p.name)}</option>`).join('');
  const read=()=>{ mb.querySelectorAll('[data-rf]').forEach(el=>{ const r=data[+el.dataset.ri]; const f=el.dataset.rf; r[f]=el.type==='checkbox'?el.checked:el.value.trim(); });
    mb.querySelectorAll('[data-of]').forEach(el=>{ const o=data[+el.dataset.ri].ops[+el.dataset.oi]; const f=el.dataset.of; o[f]=f==='op'?(el.value===''?'':+el.value):el.value.trim(); }); };
  const render=()=>{
    mb.innerHTML=`<div class="panel" style="margin-bottom:12px"><h3>How WIP is kept</h3><div class="row">
      <label class="field">WIP source<select id="rmode"><option ${!routingOn()?'selected':''}>Synchro snapshot</option><option value="Routing" ${routingOn()?'selected':''}>Routing (app moves WIP)</option></select></label>
      <label class="field">Entry stage(s) uploaded from Synchro<input id="rent" value="${esc(S.cfg.settings.entryStages||'1060')}" style="width:120px"></label><button class="btn" id="rmsave">Save</button></div>
      <p class="small muted" style="margin-bottom:0"><b>Synchro snapshot:</b> every upload replaces the whole WIP. <b>Routing:</b> upload only adds new entry-stage castings; when a department submits actuals, the completed quantity moves to the <b>next operation</b> of its route (stage start = that day). After the <b>last operation</b> the casting leaves WIP.</p></div>
    <p class="small muted">A route applies to castings matching its Part / Metallurgy / Customer (blank = all, * = wildcard). The most specific active route wins, so keep one general route with all three blank. Operation lead time is optional and, if filled, is used instead of the stage lead time for this route.</p>
    ${data.map((r,ri)=>{ const ops=[...r.ops.keys()];
      return `<div class="panel" style="margin-bottom:12px;${r.active===false?'opacity:.65':''}">
      <div class="row" style="align-items:flex-end">
        <label class="field">Route name<input data-ri="${ri}" data-rf="name" value="${esc(r.name||'')}" style="width:190px"></label>
        <label class="field">Part (optional)<input data-ri="${ri}" data-rf="part" value="${esc(r.part||'')}" style="width:110px"></label>
        <label class="field">Metallurgy (optional)<input data-ri="${ri}" data-rf="metallurgy" value="${esc(r.metallurgy||'')}" style="width:110px"></label>
        <label class="field">Customer (optional)<input data-ri="${ri}" data-rf="customer" value="${esc(r.customer||'')}" style="width:140px"></label>
        <label class="small"><input type="checkbox" data-ri="${ri}" data-rf="active" ${r.active!==false?'checked':''}> Active</label>
        <label class="field" style="flex:1">Remarks<input data-ri="${ri}" data-rf="remarks" value="${esc(r.remarks||'')}" style="width:100%"></label>
        <button class="btn ghost sm" data-copy="${ri}">Copy</button><button class="btn danger sm" data-delr="${ri}">Delete route</button></div>
      <div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Op no.</th><th>Process area (work centre)</th><th>Operation description</th><th>In-house / Subcontract</th><th>Lead time days (optional)</th><th></th></tr></thead><tbody>
      ${ops.map(oi=>{ const o=r.ops[oi]; return `<tr><td><input type="number" step="10" data-ri="${ri}" data-oi="${oi}" data-of="op" value="${o.op}" style="width:70px"></td>
        <td><select data-ri="${ri}" data-oi="${oi}" data-of="pid">${opts(o.pid)}</select></td>
        <td><input data-ri="${ri}" data-oi="${oi}" data-of="desc" value="${esc(o.desc||'')}" style="width:200px"></td>
        <td><select data-ri="${ri}" data-oi="${oi}" data-of="type"><option ${o.type!=='Subcontract'?'selected':''}>In-house</option><option ${o.type==='Subcontract'?'selected':''}>Subcontract</option></select></td>
        <td><input type="number" min="0" step="0.5" data-ri="${ri}" data-oi="${oi}" data-of="lt" value="${o.lt??''}" placeholder="stage LT" style="width:90px"></td>
        <td class="row" style="flex-wrap:nowrap"><button class="btn ghost sm" data-up="${ri}:${oi}" aria-label="Move up">↑</button><button class="btn ghost sm" data-dn="${ri}:${oi}" aria-label="Move down">↓</button><button class="btn danger sm" data-delo="${ri}:${oi}">Remove</button></td></tr>`; }).join('')}
      </tbody></table></div>
      <div class="row" style="margin-top:8px;justify-content:space-between"><button class="btn ghost sm" data-addo="${ri}">+ Add operation</button>
        <span class="small muted">Flow: ${routeSteps(r).map(pid=>esc(pid)).join(' → ')||'–'}</span></div></div>`; }).join('')}
    <div class="row"><button class="btn ghost" id="raddr">+ Add route</button><button class="btn" id="rsave">Save routing</button></div>`;
    $('#rmsave').onclick=async()=>{ const md=$('#rmode').value, en=$('#rent').value.trim()||'1060';
      await saveConfig(c=>{ c.settings.wipMode=md; c.settings.entryStages=en; }, 'WIP source = '+md+', entry stage(s) '+en); await loadAll(); toast('Saved: '+md+'.'); go('masters'); };
    const defaults=new Set(['Knock out','RR cutting & S/G','Heat treatment','1st fettling','Rough machining','Finish fettling',...S.cfg.processes.map(p=>p.name)]);
    mb.querySelectorAll('select[data-of="pid"]').forEach(sel=>sel.onchange=()=>{ const q=`[data-ri="${sel.dataset.ri}"][data-oi="${sel.dataset.oi}"]`;
      const d=mb.querySelector(q+'[data-of="desc"]'); if(!d.value || defaults.has(d.value)) d.value=procName(sel.value);
      mb.querySelector(q+'[data-of="type"]').value=/subcontract/i.test(procName(sel.value))?'Subcontract':'In-house'; });
    const act=(sel,fn)=>mb.querySelectorAll(sel).forEach(b=>b.onclick=()=>{ read(); fn(b); render(); });
    act('[data-addo]',b=>{ const r=data[+b.dataset.addo]; const last=r.ops.reduce((m,o)=>Math.max(m,+o.op||0),0); r.ops.push({op:last+10,pid:'',desc:'',type:'In-house',lt:''}); });
    act('[data-delo]',b=>{ const [ri,oi]=b.dataset.delo.split(':').map(Number); data[ri].ops.splice(oi,1); });
    const swap=(ri,a,b2)=>{ const o=data[ri].ops; if(b2<0||b2>=o.length) return; const t=o[a].pid, d=o[a].desc, ty=o[a].type, l=o[a].lt; Object.assign(o[a],{pid:o[b2].pid,desc:o[b2].desc,type:o[b2].type,lt:o[b2].lt}); Object.assign(o[b2],{pid:t,desc:d,type:ty,lt:l}); };
    act('[data-up]',b=>{ const [ri,oi]=b.dataset.up.split(':').map(Number); swap(ri,oi,oi-1); });
    act('[data-dn]',b=>{ const [ri,oi]=b.dataset.dn.split(':').map(Number); swap(ri,oi,oi+1); });
    act('[data-delr]',b=>{ data.splice(+b.dataset.delr,1); });
    act('[data-copy]',b=>{ const c=JSON.parse(JSON.stringify(data[+b.dataset.copy])); c.id=uidGen('RT'); c.name=(c.name||'Route')+' (copy)'; c.part=c.part||''; data.push(c); });
    $('#raddr').onclick=()=>{ read(); data.push({id:uidGen('RT'),name:'',part:'',metallurgy:'',customer:'',active:true,remarks:'',ops:[{op:10,pid:'1060',desc:'Knock out',type:'In-house',lt:''}]}); render(); };
    $('#rsave').onclick=async()=>{ read();
      data.forEach(r=>{ r.ops.forEach(o=>{ if(!o.desc && o.pid) o.desc=procName(o.pid); }); r.ops.sort((a,b)=>(+a.op||0)-(+b.op||0)); r.steps=routeSteps(r).join(' > '); });
      const ids=new Set(S.cfg.processes.map(p=>p.id));
      for(const r of data){ if(!r.name) return toast('Every route needs a name.',true); if(!r.ops.length) return toast('Route '+r.name+' has no operations.',true);
        if(r.ops.some(o=>!o.pid||!ids.has(o.pid))) return toast('Route '+r.name+': choose a process area for every operation.',true);
        if(r.ops.some(o=>!(+o.op>0))) return toast('Route '+r.name+': every operation needs an Op no. (10, 20, 30 …).',true);
        if(new Set(r.ops.map(o=>+o.op)).size!==r.ops.length) return toast('Route '+r.name+': operation numbers must be unique.',true);
        if(new Set(r.ops.map(o=>o.pid)).size!==r.ops.length) return toast('Route '+r.name+' uses the same process area twice.',true);
        if(r.ops.some(o=>o.lt!=='' && !(+o.lt>0))) return toast('Route '+r.name+': operation lead time must be greater than zero.',true); }
      if(!data.some(r=>r.active!==false && !r.part && !r.metallurgy && !r.customer)) toast('Note: no general route (all filters blank) – castings that match no route will not move.',true);
      await saveConfig(c=>{ c.routes=data; }, 'Routing ('+data.length+' routes): '+data.map(r=>r.name+' = '+r.steps).join(' | '));
      derive(); toast('Routing saved.'); go('masters'); };
  };
  render();
}


</script>
